<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Lorena</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#974315">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   PAINEL DA LORENA
   Mesmas cores e mesma fonte do portfólio: bege rosé, pérola,
   terracota, azul golfinho, verde claro, chumbo e café.
   Cantos retos, como nas fichas do portfólio.
   ========================================================== */
:root{
  --papel:#e3d6c5; --ficha:#f0ede4; --campo:#fbfaf6;
  --terracota:#974315; --terracota-esc:#7a3411; --suave:rgba(151,67,21,.12);
  --chumbo:#383d40; --azul:#4a5b64; --golfinho:#788990; --verde:#8d957e; --verde-esc:#586248;
  --cafe:#3b2416; --sombra:#1c1410;
  --linha:rgba(59,36,22,.22); --linha-forte:rgba(59,36,22,.5);
  --vermelho:#a32a1f; --vermelho-bg:#f6d9d5;
  --amarelo:#7a5200; --amarelo-bg:#f8e7b5;
  --menu:236px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--chumbo);background:var(--papel)}
body.oculto #app{display:none}
body.travado{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
a{color:var(--terracota)}
.i{width:16px;height:16px;flex:none}

/* ---------- Falha ao conferir a sessão ---------- */
.falha{max-width:420px;margin:12vh auto;padding:20px;background:var(--ficha);border:1.5px solid var(--cafe);border-top:6px solid var(--terracota)}
.falha p{margin:8px 0 14px}

/* ---------- Estrutura ---------- */
.menu{
  position:fixed;top:0;bottom:0;left:0;width:var(--menu);z-index:60;
  display:flex;flex-direction:column;background:var(--ficha);border-right:1.5px solid var(--cafe);
}
.menu-topo{padding:16px 16px 10px}
.menu-topo b{display:block;font-size:.95rem;font-weight:700;line-height:1.2}
.menu-topo span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terracota);font-weight:600}
.menu nav{flex:1;overflow-y:auto;padding:6px 10px}
.menu h2{font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--golfinho);padding:14px 8px 6px}
.menu a.item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:2px;
  color:var(--chumbo);text-decoration:none;font-weight:500;border-left:3px solid transparent;
}
.menu a.item:hover{background:rgba(59,36,22,.06)}
.menu a.item.ativo{background:var(--suave);color:var(--terracota-esc);border-left-color:var(--terracota);font-weight:600}
.menu-rodape{padding:12px 14px;border-top:1px solid var(--linha);font-size:.78rem}
.menu-rodape .email{display:block;overflow-wrap:anywhere;color:var(--azul);margin-bottom:8px}
.conteudo{margin-left:var(--menu);min-width:0}
.topo{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px 24px;background:var(--papel);border-bottom:1.5px solid var(--linha);
}
.topo h1{font-size:1.05rem;font-weight:700}
.ib.btn-gaveta{display:none}
main{padding:20px 24px 70px;max-width:1280px}
.veu{display:none}

@media (max-width:860px){
  .menu{transform:translateX(-102%);transition:transform .2s ease;box-shadow:6px 0 0 rgba(59,36,22,.2)}
  .menu.aberto{transform:none}
  .veu.aberto{display:block;position:fixed;inset:0;z-index:55;background:rgba(40,24,14,.45)}
  .conteudo{margin-left:0}
  .ib.btn-gaveta{display:inline-flex}
  .topo{padding:10px 14px}
  main{padding:16px 14px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:6px 14px;
  font-weight:600;font-size:.82rem;line-height:1.2;text-decoration:none;cursor:pointer;
  color:var(--chumbo);background:var(--ficha);border:1.5px solid var(--sombra);box-shadow:2px 2px 0 var(--sombra);
  transition:transform .1s ease,box-shadow .1s ease;
}
.btn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--sombra)}
.btn.primario{background:var(--terracota);color:#fff}
.btn.primario:hover{background:var(--terracota-esc)}
.btn.perigo{color:var(--vermelho);border-color:var(--vermelho);box-shadow:2px 2px 0 var(--vermelho)}
.btn:disabled{opacity:.6;cursor:wait}
.ib{
  display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;cursor:pointer;
  background:transparent;border:1px solid transparent;color:var(--azul);
}
.ib:hover{background:rgba(59,36,22,.08);border-color:var(--linha)}
.ib.perigo:hover{color:var(--vermelho)}
.ib.on{color:var(--terracota)}

/* ---------- Blocos ---------- */
.cartao{background:var(--ficha);border:1px solid var(--linha);border-top:3px solid var(--terracota);padding:16px;margin-bottom:18px}
.cartao h2{font-size:.9rem;font-weight:700;margin-bottom:10px}
.cartao h2 small{font-weight:400;color:var(--azul);margin-left:6px}
.vazio{padding:22px 10px;text-align:center;color:var(--azul)}
.aviso{
  display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;padding:10px 12px;
  background:var(--amarelo-bg);color:var(--amarelo);border:1px solid #d6b45e;font-size:.85rem;
}
.aviso .i{margin-top:2px}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.barra .espaco{flex:1}
.busca{position:relative;flex:1 1 220px;max-width:360px}
.busca .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--golfinho)}
.busca input[type=search]{padding-left:32px}
input[type=text],input[type=email],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;min-height:36px;padding:7px 10px;background:var(--campo);border:1.5px solid var(--cafe);border-radius:0;
}
textarea{resize:vertical;min-height:90px}
select{appearance:auto}
.seg{display:inline-flex;border:1.5px solid var(--cafe)}
.seg button{padding:6px 12px;background:var(--ficha);border:0;border-right:1px solid var(--linha-forte);cursor:pointer;font-size:.82rem;font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--terracota);color:#fff;font-weight:600}

/* ---------- Faixa de métricas ---------- */
.metricas{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px;
  background:var(--ficha);border:1px solid var(--linha);border-top:3px solid var(--terracota);
}
.metrica{padding:11px 16px;border-left:1px dashed var(--linha-forte);min-width:0}
.metrica:first-child{border-left:0}
.metrica .rot{display:block;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--azul)}
.metrica .val{display:block;font-size:1.25rem;font-weight:700;line-height:1.3;color:var(--chumbo);overflow-wrap:anywhere}
.metrica .sub{display:block;font-size:.75rem;color:var(--azul)}
@media (max-width:600px){.metrica{border-left:0;border-top:1px dashed var(--linha-forte)}.metrica:first-child{border-top:0}}

/* ---------- Gráfico e origens ---------- */
.dupla{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.dupla{grid-template-columns:minmax(0,1fr)}}
.grafico{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px;border-bottom:1.5px solid var(--cafe)}
.grafico .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;text-align:center}
.grafico .barra-v{background:var(--terracota);min-height:0;width:100%}
.grafico .n{font-size:.68rem;color:var(--azul);line-height:1.3;min-height:14px}
.eixo{display:flex;gap:5px;margin-top:4px}
.eixo span{flex:1;text-align:center;font-size:.66rem;color:var(--azul);min-width:0}
.origem{margin-bottom:9px}
.origem .linha{display:flex;justify-content:space-between;gap:8px;font-size:.82rem}
.origem .trilho{height:6px;background:rgba(59,36,22,.1);margin-top:3px}
.origem .trilho i{display:block;height:100%;background:var(--golfinho)}

/* ---------- Tabelas ---------- */
.rolagem{overflow-x:auto;background:var(--ficha);border:1px solid var(--linha);border-top:3px solid var(--terracota)}
table{width:100%;border-collapse:collapse}
th{
  padding:8px 10px;text-align:left;white-space:nowrap;font-size:.68rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--azul);border-bottom:1.5px solid var(--cafe);
}
th button{display:inline-flex;align-items:center;gap:4px;padding:0;background:none;border:0;cursor:pointer;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit}
th button .i{width:13px;height:13px;opacity:.35}
th[aria-sort=ascending] button .i,th[aria-sort=descending] button .i{opacity:1;color:var(--terracota)}
th[aria-sort=ascending],th[aria-sort=descending]{color:var(--chumbo)}
td{padding:8px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(59,36,22,.035)}
td.num,th.num{text-align:right}
td.nb{white-space:nowrap}
td a .i{vertical-align:-3px;margin-right:2px}
th.col-marca,td.col-marca{min-width:230px}
th.col-tel,td.col-tel{width:1%;min-width:150px}
span.nb{white-space:nowrap}
td.obs{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--azul)}
td.acoes{white-space:nowrap;text-align:right}
.linkbtn{background:none;border:0;padding:0;font-weight:600;text-align:left;cursor:pointer;color:var(--chumbo)}
.linkbtn:hover{color:var(--terracota);text-decoration:underline}
tr.fav td:first-child{box-shadow:inset 4px 0 0 var(--terracota)}
tr.fav td{background:rgba(151,67,21,.06)}
th.col-estrela,td.col-estrela{width:40px;padding-left:8px;padding-right:0}
th.col-lixo,td.col-lixo{width:44px;text-align:center;padding-left:4px;padding-right:8px}
td.col-lixo{position:sticky;right:0;background:var(--ficha)}
th.col-lixo{position:sticky;right:0;background:var(--ficha)}
tr.fav td.col-lixo{background:#f1e5d9}
td.col-lixo .ib{color:var(--golfinho)}
td.col-lixo .ib:hover{color:var(--vermelho);background:var(--vermelho-bg);border-color:var(--vermelho)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ib.estrela{color:var(--golfinho)}
.ib.estrela:hover{color:var(--terracota)}
.ib.estrela.on{color:var(--terracota)}
.ib.estrela.on .i{fill:currentColor}
.btn[aria-pressed=true]{background:#f6e0cf;border-color:var(--terracota);color:var(--terracota-esc)}
.btn[aria-pressed=true] .i{fill:currentColor}
tr.arrastando td{background:var(--suave)}
tr.escondido td{opacity:.5}
.alca{cursor:grab;touch-action:none;color:var(--golfinho)}
.alca:active{cursor:grabbing}
.mini{display:block;width:34px;height:60px;object-fit:cover;background:var(--golfinho)}

/* ---------- Pílulas ---------- */
.pil{display:inline-block;padding:1px 8px;font-size:.72rem;font-weight:600;line-height:1.6;white-space:nowrap;border:1px solid}
.p-lead{background:#dfe5e8;color:#3b4a52;border-color:#a9b7bd}
.p-conversando{background:#f6e0cf;color:#7a3411;border-color:#d9a982}
.p-cliente{background:#e1e6d3;color:#3f4a30;border-color:#a9b38f}
.p-parada{background:#e2ddd3;color:#5a554b;border-color:#bdb6a8}
.p-conteudo{background:#e1e6d3;color:#3f4a30;border-color:#a9b38f}
.p-publicidade{background:#dfe5e8;color:#3b4a52;border-color:#a9b7bd}
.p-s0{background:#e2ddd3;color:#5a554b;border-color:#bdb6a8}
.p-s1{background:#dfe5e8;color:#3b4a52;border-color:#a9b7bd}
.p-s2{background:#d3dde3;color:#2f4652;border-color:#8ea4b0}
.p-s3{background:#f6e0cf;color:#7a3411;border-color:#d9a982}
.p-s4{background:#f1cdb4;color:#6a2c0d;border-color:#cf9169}
.p-s5{background:#e1e6d3;color:#3f4a30;border-color:#a9b38f}
.p-s6{background:#c9d3b4;color:#2f3a22;border-color:#8d9c70}
.p-pendente{background:var(--amarelo-bg);color:var(--amarelo);border-color:#d6b45e}
.p-pago{background:#e1e6d3;color:#3f4a30;border-color:#a9b38f}
.p-exemplo{background:transparent;color:var(--azul);border-style:dashed;border-color:var(--golfinho);margin-left:6px}
.et{display:inline-block;margin-left:6px;padding:0 6px;font-size:.68rem;font-weight:700;line-height:1.6;white-space:nowrap}
.et.vermelha{background:var(--vermelho);color:#fff}
.et.amarela{background:#f0c94a;color:#4a3300}

/* ---------- Calendário ---------- */
.cal-rolagem{overflow-x:auto}
.cal-cab{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:640px;background:var(--ficha);border:1px solid var(--linha);border-bottom:0;border-top:3px solid var(--terracota)}
.cal-cab span{padding:6px 8px;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--azul)}
.cal-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:640px;border-left:1px solid var(--linha);border-top:1px solid var(--linha)}
.dia{
  position:relative;min-height:108px;padding:4px;cursor:pointer;background:var(--ficha);
  border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);
}
.dia.fora{background:rgba(240,237,228,.4)}
.dia.fora .dnum{opacity:.4}
.dia.fora .chip{opacity:.5}
.dia.hoje{box-shadow:inset 0 0 0 2px var(--terracota)}
.dnum{display:inline-block;min-width:22px;padding:0 5px;font-size:.75rem;font-weight:600;text-align:center}
.dia.hoje .dnum{background:var(--terracota);color:#fff}
.dia .mais-add{
  position:absolute;top:2px;right:2px;width:22px;height:22px;padding:0;display:none;align-items:center;justify-content:center;
  background:var(--suave);border:1px solid var(--terracota);color:var(--terracota);cursor:pointer;
}
.dia:hover .mais-add,.dia .mais-add:focus-visible{display:flex}
@media (hover:none){.dia .mais-add{display:flex;opacity:.6}}
.chip{
  display:block;width:100%;margin-top:3px;padding:2px 5px;text-align:left;font-size:.7rem;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border:1px solid;
}
.chip.gravar{background:#f6e0cf;color:#7a3411;border-color:#d9a982}
.chip.editar{background:#dfe5e8;color:#3b4a52;border-color:#a9b7bd}
.chip.postar{background:#e1e6d3;color:#3f4a30;border-color:#a9b38f}
.chip.prazo{background:var(--ficha);color:var(--chumbo);border-color:var(--chumbo);border-left-width:4px}
.chip.feito{text-decoration:line-through;opacity:.55}
.chip-mais{margin-top:3px;padding:0 2px;background:none;border:0;font-size:.7rem;font-weight:600;color:var(--terracota);cursor:pointer;text-decoration:underline}
.pra-tras .item{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--linha)}
.pra-tras .item:last-child{border-bottom:0}
.pra-tras .quando{color:var(--vermelho);font-weight:600;font-size:.8rem}
.lista-dia .item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--linha)}
.lista-dia .item .txt{flex:1;min-width:0;overflow-wrap:anywhere}

/* ---------- Modal ---------- */
.fundo-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(40,24,14,.55)}
.modal{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:16px 18px 18px;background:var(--ficha);border:1.5px solid var(--cafe);border-top:6px solid var(--terracota);box-shadow:5px 5px 0 rgba(59,36,22,.3)}
.modal.largo{max-width:680px}
.modal-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.modal-topo h2{font-size:1rem;font-weight:700}
.grade-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grade-form .larga{grid-column:1/-1}
@media (max-width:520px){.grade-form{grid-template-columns:minmax(0,1fr)}}
.campo label{display:block;margin-bottom:3px;font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--azul)}
.campo.marcar label{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:.85rem;letter-spacing:0;text-transform:none;color:var(--chumbo);font-weight:500}
.campo.marcar input{width:auto;min-height:0}
.erro-form{margin-top:10px;padding:8px 10px;background:var(--vermelho-bg);color:var(--vermelho);border:1px solid var(--vermelho);font-size:.85rem}
.modal-rodape{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.modal-rodape .espaco{flex:1}

/* ---------- Importar planilha ---------- */
/* ---------- Seleção de marcas para o disparo ---------- */
th.col-sel,td.col-sel{width:36px;padding-left:10px;padding-right:0}
td.col-sel input{width:auto;min-height:0;cursor:pointer;accent-color:var(--terracota)}
td.col-sel input:disabled{cursor:not-allowed;opacity:.4}
tr.sel td{background:rgba(88,98,72,.10)}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px;padding:8px 12px;background:#e9efdd;border:1px solid #a9b38f;font-size:.85rem}
.selbar .espaco{flex:1}
.selbar .btn{min-height:30px;padding:3px 10px}

/* ---------- Aba Prospecção ---------- */
.pr-capa{border-radius:20px;padding:26px 28px 22px;margin-bottom:18px;color:#fbeee4;background:linear-gradient(135deg,var(--terracota) 0%,var(--terracota-esc) 55%,#4d200a 100%);box-shadow:0 10px 28px rgba(122,52,17,.28)}
.pr-capa-topo{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.pr-capa-txt{max-width:640px}
.pr-capa-icone{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);margin-bottom:12px}
.pr-capa-icone .i{width:26px;height:26px;color:#fff}
.pr-capa h2{font-size:1.7rem;font-weight:800;color:#fff;letter-spacing:-.01em;margin-bottom:6px}
.pr-capa p{font-size:.95rem;line-height:1.55;color:rgba(255,255,255,.88)}
.pr-capa-num{text-align:right}
.pr-capa-num strong{display:block;font-size:3.4rem;line-height:1;font-weight:800;color:#fff}
.pr-capa-num span{font-size:.85rem;color:rgba(255,255,255,.82)}
.pr-etiquetas{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pr-etiquetas span{padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);font-size:.78rem;font-weight:600;color:#fff}
.pr-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.pr-kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px 12px;background:var(--ficha);border:1px solid var(--linha);border-left:6px solid var(--cor);border-radius:12px}
.pr-kpi strong{font-size:2rem;line-height:1.1;font-weight:800;color:var(--cor)}
.pr-kpi-nome{font-size:.8rem;font-weight:700;color:var(--chumbo)}
.pr-kpi small{font-size:.72rem;color:var(--azul)}
.pr-grade{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.pr-form{min-width:0}
.pr-previa-col{position:sticky;top:76px;min-width:0}
.pr-previa-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pr-previa-topo h3{font-size:.95rem;font-weight:700}
.pr-palco{padding:22px 16px;background:#d6c7b1;border-radius:16px;border:1px solid var(--linha)}

}
function fmtData(s) { if (!s) return ''; var p = String(s).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
function moeda(n) { return (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function parseValor(s) {
  s = String(s == null ? '' : s).replace(/[R$\s]/g, '');
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function idYT(link) {
  var m = String(link || '').match(/(?:shorts\/|v=|youtu\.be\/|embed\/)([\w-]{11})/);
  return m ? m[1] : '';
}
function digitos(s) { return String(s || '').replace(/\D/g, ''); }
function linkWhats(tel) {
  var d = digitos(tel);
  if (d.length < 10) return '';
  if (d.indexOf('55') !== 0) d = '55' + d;
  return 'https://wa.me/' + d;
}
function usuarioInsta(s) {
  var u = String(s || '').trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/[/?#].*$/, '');
  return /^[\w.]+$/.test(u) ? u : '';
}

var timerToast = null;
function toast(msg, erro) {

  t.textContent = msg; t.className = 'toast' + (erro ? ' erro' : ''); t.hidden = false;
  clearTimeout(timerToast);
  timerToast = setTimeout(function () { t.hidden = true; }, erro ? 6000 : 2600);
}

/* ---------- Avisos (o painel não abre em branco quando falta algo) ---------- */
function explicar(tabela, err) {
  var cod = err && err.code, msg = String((err && err.message) || err || '');
  var col = msg.match(/Could not find the '([^']+)' column/i) || msg.match(/column ["\w.]*?"?(\w+)"? (?:of relation "\w+" )?does not exist/i);
  if (cod === 'PGRST205' || cod === '42P01' || /Could not find the table|relation .* does not exist/i.test(msg)) {
    return 'A tabela "' + tabela + '" não existe no banco. Rode o arquivo banco.sql no Supabase.';
  }
  if (cod === 'PGRST204' || cod === '42703' || col) {
    return 'Falta o campo "' + (col ? col[1] : '?') + '" na tabela "' + tabela + '". Rode o banco.sql de novo no Supabase.';
  }
  if (cod === '42501' || /permission denied|row-level security/i.test(msg)) {
    return 'O banco recusou o acesso à tabela "' + tabela + '". Confira se você entrou com o e-mail certo e se o banco.sql foi rodado.';
  }
  if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) return 'Sem conexão com a internet. Confira e tente de novo.';
  if (/JWT|expired/i.test(msg)) return 'Sua sessão expirou. Clique em Sair e entre de novo.';
  return 'Não consegui falar com a tabela "' + tabela + '": ' + msg;
}
function avisar(tabela, err) {
  estado.avisos[tabela] = explicar(tabela, err);
  pintarAvisos();
}
function pintarAvisos() {
  var ks = Object.keys(estado.avisos);
  $('#avisos').innerHTML = ks.map(function (k) {
    return '<div class="aviso" role="alert">' + ic('alerta') + '<span>' + esc(estado.avisos[k]) + ' O resto do painel continua funcionando.</span></div>';
  }).join('');
}

/* ---------- Leitura e escrita no banco ---------- */
var rodada = 0; /* muda a cada troca de aba, para um aviso atrasado não aparecer na aba errada */
async function ler(tabela, ord) {
  var minha = rodada;
  try {
    var q = sb.from(tabela).select('*');
    if (ord) q = q.order(ord, { ascending: true });
    var r = await q;
    if (r.error && ord) { r = await sb.from(tabela).select('*'); } /* se a coluna de ordem faltar, lê sem ordenar */
    if (r.error) { if (minha === rodada) avisar(tabela, r.error); return []; }
    return r.data || [];
  } catch (e) { if (minha === rodada) avisar(tabela, e); return []; }
}
async function gravar(tabela, consulta) {
  var r;
  try { r = await consulta; } catch (e) { throw new Error(explicar(tabela, e)); }
  if (r && r.error) throw new Error(explicar(tabela, r.error));
  return r;
}

/* ---------- Modal ---------- */
var modalAtual = null, focoAntes = null;
function abrirModal(html, largo) {
  fecharModal(true);
  focoAntes = document.activeElement;
  var f = document.createElement('div');
  f.className = 'fundo-modal';
  f.innerHTML = '<div class="modal' + (largo ? ' largo' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(f);
  document.body.classList.add('travado');
  f.addEventListener('mousedown', function (e) { if (e.target === f) fecharModal(); });
  f.addEventListener('click', function (e) { if (e.target.closest('[data-fechar]')) fecharModal(); });
  modalAtual = f;
  var primeiro = f.querySelector('input:not([type=checkbox]),select,textarea');
  (primeiro || f.querySelector('button')).focus();
  return f.firstElementChild;
}
function fecharModal(semFoco) {
  if (!modalAtual) return;
  modalAtual.remove(); modalAtual = null;
  document.body.classList.remove('travado');
  if (!semFoco && focoAntes && focoAntes.focus) { try { focoAntes.focus(); } catch (e) {} }
}
function confirmar(texto, botao) {
  return new Promise(function (resolve) {
    var f = document.createElement('div');
    f.className = 'fundo-modal'; f.style.zIndex = 120;
    f.innerHTML = '<div class="modal" role="alertdialog" aria-modal="true" aria-label="Confirmar"><div class="modal-topo"><h2>Confirmar</h2></div><p>' + esc(texto) + '</p>' +
      '<div class="modal-rodape"><span class="espaco"></span><button class="btn" type="button" data-nao>Cancelar</button>' +
      '<button class="btn perigo" type="button" data-sim>' + esc(botao || 'Apagar') + '</button></div></div>';
    document.body.appendChild(f);
    var antes = document.activeElement;
    function fim(r) {
      document.removeEventListener('keydown', tecla, true);
      f.remove();
      if (antes && antes.focus) { try { antes.focus(); } catch (e) {} }
      resolve(r);
    }
    function tecla(e) { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); fim(false); } }
    document.addEventListener('keydown', tecla, true);
    f.querySelector('[data-sim]').addEventListener('click', function () { fim(true); });
    f.querySelector('[data-nao]').addEventListener('click', function () { fim(false); });
    f.addEventListener('mousedown', function (e) { if (e.target === f) fim(false); });
    f.querySelector('[data-nao]').focus();
  });
}
/* Monta um formulário dentro do modal.
   campos: [{k, label, tipo: text|date|select|checkbox|textarea, opcoes, lista, obrigatorio, larga, dica}] */
function formulario(cfg) {
  var v = cfg.valores || {};
  var html = '<div class="modal-topo"><h2>' + esc(cfg.titulo) + '</h2><button class="ib" type="button" data-fechar aria-label="Fechar">' + ic('x') + '</button></div><form novalidate><div class="grade-form">';
  cfg.campos.forEach(function (c, i) {
    var id = 'f-' + c.k, val = v[c.k] == null ? (c.padrao == null ? '' : c.padrao) : v[c.k];
    var cls = 'campo' + (c.larga ? ' larga' : '') + (c.tipo === 'checkbox' ? ' marcar larga' : '');
    var corpo = '';
    if (c.tipo === 'select') {
      corpo = '<select id="' + id + '" name="' + c.k + '">' + c.opcoes.map(function (o) {
        return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(val) ? ' selected' : '') + '>' + esc(o.t) + '</option>';
      }).join('') + '</select>';
    } else if (c.tipo === 'textarea') {
      corpo = '<textarea id="' + id + '" name="' + c.k + '">' + esc(val) + '</textarea>';
    } else if (c.tipo === 'checkbox') {
      corpo = '<label><input type="checkbox" id="' + id + '" name="' + c.k + '"' + (val ? ' checked' : '') + '> ' + esc(c.label) + '</label>';
    } else {
      corpo = '<input id="' + id + '" name="' + c.k + '" type="' + (c.tipo || 'text') + '" value="' + esc(val) + '"' +
        (c.lista ? ' list="dl-' + c.k + '"' : '') + (c.dica ? ' placeholder="' + esc(c.dica) + '"' : '') + '>' +
        (c.lista ? '<datalist id="dl-' + c.k + '">' + c.lista.map(function (o) { return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>' : '');
    }
    html += '<div class="' + cls + '">' + (c.tipo === 'checkbox' ? '' : '<label for="' + id + '">' + esc(c.label) + (c.obrigatorio ? ' *' : '') + '</label>') + corpo + '</div>';
  });
  html += '</div><p class="erro-form" role="alert" hidden></p><div class="modal-rodape">' +
    (cfg.onApagar ? '<button class="btn perigo" type="button" data-apagar>' + ic('lixo') + 'Apagar</button>' : '') +
    '<span class="espaco"></span><button class="btn" type="button" data-fechar>Cancelar</button>' +
    '<button class="btn primario" type="submit">Salvar</button></div></form>';
  var m = abrirModal(html);
  var form = m.querySelector('form'), erro = m.querySelector('.erro-form');
  function mostrarErro(t) { erro.textContent = t; erro.hidden = false; }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    erro.hidden = true;
    var vals = {};
    for (var i = 0; i < cfg.campos.length; i++) {
      var c = cfg.campos[i], el = form.elements[c.k];
      vals[c.k] = c.tipo === 'checkbox' ? el.checked : el.value.trim();
      if (c.obrigatorio && !vals[c.k]) { mostrarErro('Preencha o campo "' + c.label + '".'); el.focus(); return; }
    }
    var btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try { await cfg.onSalvar(vals); fecharModal(); }
    catch (err) { mostrarErro(err.message || 'Não consegui salvar.'); btn.disabled = false; }
  });
  var ap = m.querySelector('[data-apagar]');
  if (ap) ap.addEventListener('click', async function () {
    if (!(await confirmar(cfg.textoApagar || 'Apagar? Não dá para desfazer.'))) return;
    try { await cfg.onApagar(); fecharModal(); }
    catch (err) { abrirModal('<div class="modal-topo"><h2>Não deu certo</h2></div><p>' + esc(err.message) + '</p><div class="modal-rodape"><span class="espaco"></span><button class="btn" data-fechar type="button">Fechar</button></div>'); }
  });
  return m;
}

/* ---------- CSV que abre certinho no Excel (com acento) ---------- */
function baixarCSV(nome, cabecalho, linhas) {
  function cel(x) {
    var s = String(x == null ? '' : x);
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  var texto = '﻿' + [cabecalho].concat(linhas).map(function (l) { return l.map(cel).join(';'); }).join('\r\n');
  var blob = new Blob([texto], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome + '-' + iso(hoje()) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
}

  $('#btn-gaveta').innerHTML = ic('menu');

  var grupos = {}, ordem = [];

  });

    return '<h2>' + esc(g) + '</h2>' + grupos[g].map(function (k) {

    }).join('');
  }).join('');

  $('#menu-nav').addEventListener('click', function (e) {

    if (!a) return;
    e.preventDefault();
    irPara(a.getAttribute('data-aba'));
  });
  $('#btn-sair').addEventListener('click', function () {
    sb.auth.signOut().then(function () { location.replace('../login/'); }, function () { location.replace('../login/'); });
  });
  $('#btn-gaveta').addEventListener('click', function () { gaveta(!$('#menu').classList.contains('aberto')); });
  $('#veu').addEventListener('click', function () { gaveta(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (modalAtual) fecharModal(); else gaveta(false); }
  });
  sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') location.replace('../login/'); });
  window.addEventListener('hashchange', function () {
    var a = location.hash.replace('#', '');
    if (ABAS[a] && a !== estado.aba) irPara(a);
  });

  /* confirma com o servidor, em segundo plano, que a sessão ainda vale */
  sb.auth.getUser().then(function (r) {
    if (r && r.error && /JWT|session|token/i.test(r.error.message || '')) location.replace('../login/');
  }).catch(function () {});

  var inicial = location.hash.replace('#', '');
  irPara(ABAS[inicial] ? inicial : 'portfolio');

   ========================================================== */
function nomeOrigem(o) {
  o = String(o || '').toLowerCase().replace(/^www\./, '').trim();
  if (!o || o === 'direto') return 'Link direto';
  if (/instagram/.test(o)) return 'Instagram';
  if (/google/.test(o)) return 'Google';
  if (/whatsapp|wa\.me/.test(o)) return 'WhatsApp';
  if (/youtube|youtu\.be/.test(o)) return 'YouTube';
  if (/facebook|fb\.com|fb\.me/.test(o)) return 'Facebook';
  if (/tiktok/.test(o)) return 'TikTok';
  if (/linkedin|lnkd/.test(o)) return 'LinkedIn';
  if (/bing/.test(o)) return 'Bing';
  if (/twitter|t\.co|x\.com/.test(o)) return 'X';
  if (/github/.test(o)) return 'GitHub';
  return o;
}

async function lerVisitas() {
  var minha = rodada;
  var desde = iso(addDias(hoje(), -13)), todas = [];
  try {
    for (var p = 0; p < 20; p++) {
      var r = await sb.from('visitas').select('data,origem').gte('data', desde).order('id', { ascending: true }).range(p * 1000, p * 1000 + 999);
      if (r.error) { if (minha === rodada) avisar('visitas', r.error); return []; }
      todas = todas.concat(r.data || []);
      if (!r.data || r.data.length < 1000) break;
    }
  } catch (e) { if (minha === rodada) avisar('visitas', e); return []; }
  return todas;
}

  /* números (tudo começa em zero, sem divisão por zero) */
  var hojeISO = iso(hoje()), porDia = {}, i;
  for (i = 13; i >= 0; i--) porDia[iso(addDias(hoje(), -i))] = 0;
  var porOrigem = {}, total = 0, hojeN = 0;

  }

      }).join('')

/* Arrastar pela alcinha (mouse e toque) ou com as setas do teclado */
function ligarArraste(corpo, aoTerminar) {
  corpo.addEventListener('pointerdown', function (e) {
    var h = e.target.closest('.alca');
    if (!h) return;
    e.preventDefault();
    var tr = h.closest('tr');
    tr.classList.add('arrastando');
    try { h.setPointerCapture(e.pointerId); } catch (x) {}
    function mover(ev) {
      var sob = document.elementFromPoint(ev.clientX, ev.clientY);
      var alvo = sob && sob.closest('tr[data-id]');
      if (alvo && alvo !== tr && alvo.parentNode === corpo) {
        var r = alvo.getBoundingClientRect();
        corpo.insertBefore(tr, ev.clientY > r.top + r.height / 2 ? alvo.nextSibling : alvo);
      }
    }
    function fim() {
      tr.classList.remove('arrastando');
      h.removeEventListener('pointermove', mover);
      h.removeEventListener('pointerup', fim);
      h.removeEventListener('pointercancel', fim);
      aoTerminar($$('tr[data-id]', corpo).map(function (x) { return x.getAttribute('data-id'); }));
    }
    h.addEventListener('pointermove', mover);
    h.addEventListener('pointerup', fim);
    h.addEventListener('pointercancel', fim);
  });
  corpo.addEventListener('keydown', function (e) {
    var h = e.target.closest('.alca');
    if (!h || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    var tr = h.closest('tr');
    var outro = e.key === 'ArrowUp' ? tr.previousElementSibling : tr.nextElementSibling;
    if (!outro) return;
    corpo.insertBefore(tr, e.key === 'ArrowUp' ? outro : outro.nextSibling);
    h.focus();
    aoTerminar($$('tr[data-id]', corpo).map(function (x) { return x.getAttribute('data-id'); }));
  });
}

async function salvarOrdemVideos(ids) {
  var mudou = [];
  ids.forEach(function (id, i) {
    var v = estado.videos.filter(function (x) { return String(x.id) === id; })[0];
    if (v && v.ordem !== i + 1) { v.ordem = i + 1; mudou.push(v); }
  });
  estado.videos.sort(function (a, b) { return a.ordem - b.ordem; });
  if (!mudou.length) return;
  try {
    await Promise.all(mudou.map(function (v) { return gravar('videos', sb.from('videos').update({ ordem: v.ordem }).eq('id', v.id)); }));
    toast('Ordem salva.');
  } catch (err) { toast(err.message, true); desenharTela(); }
}

function desenharMarcas() {
  var q = norm(estado.marcasBusca.replace(/^@/, ''));
  var fav = estado.marcasFav || new Set();
  var lista = estado.marcas.filter(function (m) {
    if (estado.marcasSoFav && !fav.has(String(m.id))) return false;
    if (estado.marcasFiltro !== 'todas' && m.situacao !== estado.marcasFiltro) return false;
    var org = estado.colNicho ? (estado.marcasOrg || 'az') : 'az';
    if (org.indexOf('f:') === 0 && norm(m.nicho || '') !== norm(org.slice(2))) return false;
    if (!q) return true;
    return norm(m.nome).indexOf(q) >= 0 || norm(m.instagram).replace('@', '').indexOf(q) >= 0 || norm(m.email).indexOf(q) >= 0;
  }).sort(function (a, b) {
    var fa = fav.has(String(a.id)) ? 0 : 1, fb = fav.has(String(b.id)) ? 0 : 1; /* favoritas sempre em cima */
    var porNicho = 0;
    if (estado.colNicho && estado.marcasOrg === 'nicho') {
      var ordem = listaNichos().map(norm);
      var ia = a.nicho ? ordem.indexOf(norm(a.nicho)) : 999, ib = b.nicho ? ordem.indexOf(norm(b.nicho)) : 999; /* sem nicho por último */
      porNicho = ia - ib;
    }
    return fa - fb || porNicho || String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR');
  });
  estado.marcasVisiveis = lista;
  desenharSelbar();
  var alvo = $('#m-tabela');

  if (!lista.length) {
    alvo.innerHTML = '<div class="cartao"><p class="vazio">' + (estado.marcasSoFav && !fav.size ? 'Você ainda não favoritou nenhuma marca. Clique na estrela ao lado do nome para fixar a marca no topo.' : 'Nenhuma marca encontrada com essa busca ou filtro.') + '</p></div>';
    return;
  }
  alvo.innerHTML = '<div class="rolagem"><table><thead><tr>' + (estado.colSel ? '<th class="col-sel"><span class="sr">Selecionar para o disparo</span></th>' : '') + '<th class="col-estrela"><span class="sr">Favorita</span></th><th class="col-marca">Marca</th>' + (estado.colNicho ? '<th>Nicho</th>' : '') + '<th>Instagram</th><th>E-mail</th><th class="col-tel">Telefone</th><th>Situação</th><th>Observação</th><th>Último contato</th><th class="col-lixo"><span class="sr">Excluir</span></th></tr></thead><tbody>' +
    lista.map(function (m) {
      var u = usuarioInsta(m.instagram), w = linkWhats(m.telefone);
      var eFav = fav.has(String(m.id));
      var semEmail = !!m.exemplo;
      return '<tr data-id="' + esc(m.id) + '"' + ((eFav || m.selecionada) ? ' class="' + (eFav ? 'fav ' : '') + (m.selecionada ? 'sel' : '') + '"' : '') + '>' +
        (estado.colSel ? '<td class="col-sel"><input type="checkbox" data-sel="1"' + (m.selecionada ? ' checked' : '') + (semEmail ? ' disabled title="Marca de exemplo"' : (prEmailOk(m.email) ? ' title="Selecionar para o disparo de e-mails"' : ' title="Selecionar (esta marca não tem e-mail, então não recebe o disparo)"')) + ' aria-label="Selecionar ' + esc(m.nome) + ' para o disparo"></td>' : '') +
        '<td class="col-estrela"><button class="ib estrela' + (eFav ? ' on' : '') + '" type="button" data-fav="1" aria-pressed="' + eFav + '" aria-label="' + (eFav ? 'Tirar dos favoritos: ' : 'Favoritar: ') + esc(m.nome) + '" title="' + (eFav ? 'Tirar dos favoritos' : 'Favoritar e fixar no topo') + '">' + ic('estrela') + '</button></td>' +
        '<td class="col-marca"><button class="linkbtn" type="button" data-acao="editar">' + esc(m.nome) + '</button>' + (m.exemplo ? '<span class="pil p-exemplo">exemplo</span>' : '') + '</td>' +
        (estado.colNicho ? '<td class="nb">' + esc(m.nicho || '') + '</td>' : '') +
        '<td class="nb">' + (u ? '<a href="https://instagram.com/' + esc(u) + '" target="_blank" rel="noopener" title="Abrir o Instagram">' + ic('insta') + ' @' + esc(u) + '</a>' : esc(m.instagram)) + '</td>' +
        '<td class="nb">' + (m.email ? '<a href="mailto:' + esc(m.email) + '">' + esc(m.email) + '</a>' : '') + '</td>' +
        '<td class="col-tel">' + String(m.telefone || '').split(/\s*\/\s*/).map(function (t, i, todos) {
          return '<span class="nb">' + esc(t) + (w && i === todos.length - 1 ? ' <a class="ib" href="' + esc(w) + '" target="_blank" rel="noopener" aria-label="Abrir o WhatsApp de ' + esc(m.nome) + '" title="Abrir o WhatsApp">' + ic('whats') + '</a>' : '') + '</span>';
        }).join('<br>') + '</td>' +
        '<td>' + pilSituacao(m.situacao) + '</td>' +
        '<td class="obs" title="' + esc(m.obs) + '">' + esc(m.obs) + '</td>' +
        '<td class="nb">' + fmtData(m.ultimo_contato) + '</td>' +

    }).join('') + '</tbody></table></div>';
  $('tbody', alvo).addEventListener('click', async function (e) {
    if (e.target.closest('a')) return;
    var tr = e.target.closest('tr[data-id]');
    if (!tr) return;
    var id = String(tr.getAttribute('data-id'));
    if (e.target.closest('td.col-sel')) {
      var cb = e.target.closest('[data-sel]');
      if (cb && !cb.disabled) marcarSelecao([id], cb.checked);
      return;
    }
    if (e.target.closest('[data-apagar]')) {
      var alvoM = estado.marcas.filter(function (x) { return String(x.id) === id; })[0];
      if (!alvoM) return;
      if (!(await confirmar('Excluir "' + (alvoM.nome || 'esta marca') + '" da sua base? Não dá para desfazer.', 'Excluir'))) return;
      try {
        await gravar('marcas', sb.from('marcas').delete().eq('id', alvoM.id));
        try { await sb.from('marcados').delete().eq('chave', 'marca:' + alvoM.id); } catch (err2) { /* só limpeza da estrela */ }
        toast('Marca excluída.');
        desenharTela();
      } catch (err) { toast(err.message, true); }
      return;
    }
    if (e.target.closest('[data-fav]')) {
      var chave = 'marca:' + id, novo = !fav.has(id);
      if (novo) fav.add(id); else fav.delete(id);
      estado.marcasFav = fav;
      desenharMarcas();
      try { await gravar('marcados', novo ? sb.from('marcados').upsert({ chave: chave }) : sb.from('marcados').delete().eq('chave', chave)); }
      catch (err) {
        if (novo) fav.delete(id); else fav.add(id);
        desenharMarcas(); toast(err.message, true);
      }
      return;
    }
    var m = estado.marcas.filter(function (x) { return String(x.id) === id; })[0];
    if (m) formMarca(m);
  });
}

  });

/* A seleção fica salva no banco (coluna selecionada), então vale amanhã também */
async function marcarSelecao(ids, valor) {
  var conjunto = {}, antes = {};
  ids.forEach(function (i) { conjunto[i] = 1; });
  estado.marcas.forEach(function (m) { if (conjunto[m.id]) { antes[m.id] = !!m.selecionada; m.selecionada = valor; } });
  desenharMarcas();
  try {
    for (var i = 0; i < ids.length; i += 200) await gravar('marcas', sb.from('marcas').update({ selecionada: valor }).in('id', ids.slice(i, i + 200)));
  } catch (err) {
    estado.marcas.forEach(function (m) { if (conjunto[m.id]) m.selecionada = antes[m.id]; });
    desenharMarcas();
    toast(err.message, true);
  }
}

var NICHOS_PADRAO = ['Casa e Decoração', 'Beleza', 'Aplicativos e Sites'];
/* Os nichos que já existem: os padrão mais qualquer um que você tenha criado */
function listaNichos() {
  var lista = NICHOS_PADRAO.slice();
  estado.marcas.forEach(function (x) {
    var n = String(x.nicho || '').trim();
    if (n && !lista.some(function (o) { return norm(o) === norm(n); })) lista.push(n);
  });
  return lista;
}
function formMarca(m) {
  var temNicho = estado.marcas.length > 0 && ('nicho' in estado.marcas[0]);
  var nichoAtual = m ? String(m.nicho || '') : '';
  var nichos = listaNichos();
  if (nichoAtual && !nichos.some(function (o) { return norm(o) === norm(nichoAtual); })) nichos.push(nichoAtual);
  var campos = [
    { k: 'nome', label: 'Marca', obrigatorio: true, larga: true },
    { k: 'instagram', label: 'Instagram', dica: '@marca' },
    { k: 'email', label: 'E-mail', tipo: 'email' },
    { k: 'telefone', label: 'Telefone', dica: '(00) 00000-0000' },
    { k: 'situacao', label: 'Situação', tipo: 'select', opcoes: SITUACOES.map(function (s) { return { v: s.v, t: s.t }; }) }
  ];
  if (temNicho) campos.push({ k: 'nicho', label: 'Nicho', tipo: 'select', opcoes: [{ v: '', t: 'Sem nicho' }].concat(nichos.map(function (n) { return { v: n, t: n }; })).concat([{ v: '__novo', t: '+ Adicionar novo nicho…' }]) });

        var igual = listaNichos().filter(function (o) { return norm(o) === norm(d.nicho); })[0];
        if (igual) d.nicho = igual;
      }
      var dados = { nome: d.nome, instagram: d.instagram, email: d.email, telefone: d.telefone, situacao: d.situacao, obs: d.obs, ultimo_contato: d.ultimo_contato || null };
      if (temNicho) dados.nicho = d.nicho || null;
      if (m) await gravar('marcas', sb.from('marcas').update(dados).eq('id', m.id));
      else await gravar('marcas', sb.from('marcas').insert(dados));

      toast('Marca apagada.'); desenharTela();
    } : null,

  var selNicho = modal.querySelector('#f-nicho');
  if (selNicho) selNicho.addEventListener('change', function () {

        caixa.type = 'text'; caixa.id = 'f-nicho-novo'; caixa.placeholder = 'Nome do novo nicho'; caixa.style.marginTop = '6px';
        selNicho.parentNode.appendChild(caixa);

    } else if (caixa) caixa.remove();
  });
}

/* ==========================================================
   6b) IMPORTAR PLANILHA DE MARCAS (CSV)
   Você escolhe o arquivo, o painel identifica as colunas sozinho,
   mostra uma prévia para conferir e só então grava na aba Marcas.
   ========================================================== */
var CAMPOS_IMPORT = [
  { k: 'nome', t: 'Marca', sin: ['nome da marca', 'marca', 'empresa', 'razao social', 'nome', 'cliente', 'lead', 'company', 'brand', 'name', 'negocio'] },
  { k: 'instagram', t: 'Instagram', sin: ['instagram', 'insta', 'perfil', 'ig', 'rede social', 'usuario', 'user', 'arroba'] },
  { k: 'email', t: 'E-mail', sin: ['e-mail', 'email', 'mail', 'correio'] },
  { k: 'telefone', t: 'Telefone', sin: ['telefone', 'celular', 'whatsapp', 'whats', 'zap', 'fone', 'tel', 'phone'] },
  { k: 'situacao', t: 'Situação', sin: ['situacao', 'status', 'etapa', 'fase', 'estagio'] },
  { k: 'obs', t: 'Observação', sin: ['observacao', 'observacoes', 'obs', 'notas', 'nota', 'anotacoes', 'comentario', 'comentarios', 'mensagem', 'detalhes', 'descricao'] },
  { k: 'ultimo_contato', t: 'Último contato', sin: ['ultimo contato', 'data do contato', 'data contato', 'ultima interacao', 'contatado em', 'data'] }
];
var REGEX_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function limparCab(s) { return norm(s).replace(/[^a-z0-9@ ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function letraColuna(i) {
  var s = ''; i++;
  while (i > 0) { var r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
  return s;
}
function decodificarArquivo(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); } /* CSV do Excel em português costuma vir assim */
}
function detectarSep(texto) {
  var cont = { ';': 0, ',': 0, '\t': 0 }, aspas = false, visto = false;
  for (var i = 0; i < texto.length && i < 20000; i++) {
    var c = texto.charAt(i);
    if (c === '"') aspas = !aspas;
    else if (!aspas) {
      if (c === '\n' || c === '\r') { if (visto) break; }
      else { visto = true; if (cont.hasOwnProperty(c)) cont[c]++; }
    }
  }
  var melhor = ';';
  [';', ',', '\t'].forEach(function (s) { if (cont[s] > cont[melhor]) melhor = s; });
  return melhor;
}
function lerCSV(texto, sep) {
  var linhas = [], atual = [], cel = '', aspas = false, n = texto.length;
  for (var i = 0; i < n; i++) {
    var c = texto.charAt(i);
    if (aspas) {
      if (c === '"') { if (texto.charAt(i + 1) === '"') { cel += '"'; i++; } else aspas = false; }
      else cel += c;
    } else if (c === '"' && cel === '') aspas = true;
    else if (c === sep) { atual.push(cel); cel = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto.charAt(i + 1) === '\n') i++;
      atual.push(cel); cel = ''; linhas.push(atual); atual = [];
    } else cel += c;
  }
  if (cel !== '' || atual.length) { atual.push(cel); linhas.push(atual); }
  return linhas.filter(function (l) { return l.some(function (x) { return String(x).trim() !== ''; }); });
}
function converterData(s) {
  s = String(s || '').trim();
  var m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})(?:\D.*)?$/), d, mes, a;
  if (m) { d = +m[1]; mes = +m[2]; a = +m[3]; if (a < 100) a += 2000; }
  else {
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:\D.*)?$/);
    if (!m) return null;
    a = +m[1]; mes = +m[2]; d = +m[3];
  }
  if (mes < 1 || mes > 12 || d < 1 || d > 31 || a < 2000 || a > 2100) return null;
  if (new Date(a, mes - 1, d).getMonth() !== mes - 1) return null;
  return a + '-' + (mes < 10 ? '0' : '') + mes + '-' + (d < 10 ? '0' : '') + d;
}
function situacaoDe(txt, padrao) {
  var n = norm(txt).trim();
  if (!n) return padrao;
  if (/nao contatad|a contatar|nao abordad/.test(n)) return 'lead';
  if (/parad|paus|perdid|sem resposta|nao respond|inativ|arquiv|descart|recus|sem interesse/.test(n)) return 'parada';
  if (/cliente|fechad|ganh|contratad|ativ[oa]/.test(n)) return 'cliente';
  if (/convers|negoci|respond|retorn|proposta|andamento|contato feito|quente|interess|agend|orcament/.test(n)) return 'conversando';
  if (/lead|novo|frio|prospec|captad|potencial/.test(n)) return 'lead';
  return padrao;
}
/* Aceita @usuario, usuario, instagram.com/usuario e https://www.instagram.com/usuario/ */
function instaDe(s) {
  var u = usuarioInsta(String(s || '').trim().replace(/^(https?:\/\/)?(www\.)?instagram\.com\//i, ''));
  return u ? '@' + u : '';
}
function pareceTelefone(v) {
  if (/^\d{4}-\d{2}-\d{2}/.test(v)) return false;
  var d = v.replace(/\D/g, '');
  return d.length >= 8 && d.length <= 15 && v.replace(/[\d\s()+\-.]/g, '').length === 0;
}
/* Uma linha de títulos não tem e-mail, @perfil nem telefone. Se tiver, é dado. */
function linhaComDados(linha) {
  return linha.some(function (v) {
    v = String(v == null ? '' : v).trim();
    return REGEX_EMAIL.test(v) || /^@[\w.]+$/.test(v) || pareceTelefone(v);
  });
}
function cabecalhoReconhecido(linha) {
  if (linhaComDados(linha)) return false;
  return linha.some(function (h) {
    var hn = ' ' + limparCab(h) + ' ';
    if (hn.trim() === '') return false;
    return CAMPOS_IMPORT.some(function (c) {
      return c.sin.some(function (s) { var sn = limparCab(s); return hn.trim() === sn || hn.indexOf(' ' + sn + ' ') >= 0; });
    });
  });
}
/* Descobre qual coluna é qual: primeiro pelo título, depois olhando o conteúdo das células */
function autoMapa(cab, dados, temCab) {
  var mapa = {}, usadas = {}, cand = [], ncol = cab.length;
  CAMPOS_IMPORT.forEach(function (c) { mapa[c.k] = -1; });
  if (temCab) {
    cab.forEach(function (h, j) {
      var hn = ' ' + limparCab(h) + ' ';
      if (hn.trim() === '') return;
      CAMPOS_IMPORT.forEach(function (c) {
        var melhor = 0;
        c.sin.forEach(function (s) {
          var sn = limparCab(s);
          if (hn.trim() === sn) melhor = Math.max(melhor, 3);
          else if (hn.indexOf(' ' + sn + ' ') >= 0) melhor = Math.max(melhor, 2);
        });
        if (melhor) cand.push({ k: c.k, j: j, p: melhor });
      });
    });
    cand.sort(function (a, b) { return b.p - a.p || a.j - b.j; });
    cand.forEach(function (x) { if (mapa[x.k] < 0 && !usadas[x.j]) { mapa[x.k] = x.j; usadas[x.j] = 1; } });
  }
  var amostra = dados.slice(0, 60);
  function frac(j, teste) {
    var t = 0, ok = 0;
    amostra.forEach(function (l) { var v = String(l[j] == null ? '' : l[j]).trim(); if (!v) return; t++; if (teste(v)) ok++; });
    return t ? ok / t : 0;
  }
  var testes = {
    email: function (v) { return REGEX_EMAIL.test(v); },
    instagram: function (v) { return /^@[\w.]+$/.test(v) || /^(https?:\/\/)?(www\.)?instagram\.com\//i.test(v); },
    telefone: pareceTelefone,
    ultimo_contato: function (v) { return converterData(v) !== null; }
  };
  Object.keys(testes).forEach(function (k) {
    if (mapa[k] >= 0) return;
    for (var j = 0; j < ncol; j++) { if (!usadas[j] && frac(j, testes[k]) >= 0.6) { mapa[k] = j; usadas[j] = 1; break; } }
  });
  if (mapa.nome < 0) {
    var pareceNome = function (v) { return /[a-zA-ZÀ-ÿ]/.test(v) && !REGEX_EMAIL.test(v) && !/^https?:/i.test(v) && v.length <= 80; };
    for (var j = 0; j < ncol; j++) { if (!usadas[j] && frac(j, pareceNome) >= 0.6) { mapa.nome = j; usadas[j] = 1; break; } }
  }
  return mapa;
}
/* Transforma as linhas da planilha em marcas prontas para gravar */
function construirImport(dados, mapa, opc, cab) {
  var usadas = {};
  Object.keys(mapa).forEach(function (k) { if (mapa[k] >= 0) usadas[mapa[k]] = 1; });
  function chaves(r) {
    var ks = [];
    if (r.email) ks.push('e:' + String(r.email).toLowerCase());
    var u = usuarioInsta(r.instagram);
    if (u) ks.push('i:' + u.toLowerCase());
    if (r.nome) ks.push('n:' + norm(r.nome).replace(/\s+/g, ' ').trim());
    return ks;
  }
  var visto = {};
  estado.marcas.forEach(function (m) { chaves(m).forEach(function (k) { visto[k] = 1; }); });
  var novas = [], repetidas = 0, semNome = 0;
  dados.forEach(function (l) {
    if (!l.some(function (x) { return String(x == null ? '' : x).trim() !== ''; })) return;
    function get(k) { var j = mapa[k]; return j >= 0 ? String(l[j] == null ? '' : l[j]).trim() : ''; }
    var r = {
      nome: get('nome'), instagram: instaDe(get('instagram')), email: get('email').toLowerCase(), telefone: get('telefone'),
      situacao: situacaoDe(get('situacao'), opc.situacao), obs: get('obs'), ultimo_contato: converterData(get('ultimo_contato'))
    };
    if (r.email && !REGEX_EMAIL.test(r.email)) r.email = '';
    if (opc.juntar) {
      var extras = [];
      cab.forEach(function (h, j) {
        if (usadas[j]) return;
        var v = String(l[j] == null ? '' : l[j]).trim();
        if (v) extras.push((String(h || '').trim() || ('Coluna ' + letraColuna(j))) + ': ' + v);
      });
      if (extras.length) r.obs = (r.obs ? r.obs + ' | ' : '') + extras.join(' | ');
    }
    if (!r.nome) r.nome = r.instagram || (r.email ? r.email.split('@')[0] : '');
    if (!r.nome) { semNome++; return; }
    r.nome = r.nome.slice(0, 200); r.email = r.email.slice(0, 200); r.telefone = r.telefone.slice(0, 60);
    r.instagram = r.instagram.slice(0, 100); r.obs = r.obs.slice(0, 3000);
    var ks = chaves(r);
    if (opc.pular && ks.some(function (k) { return visto[k]; })) { repetidas++; return; }
    ks.forEach(function (k) { visto[k] = 1; });
    novas.push(r);
  });
  return { novas: novas, repetidas: repetidas, semNome: semNome };
}

/* ---------- Google Planilhas: a planilha precisa estar compartilhada como "Qualquer pessoa com o link" ---------- */
function urlsPlanilhaGoogle(txt) {
  txt = String(txt || '').trim();
  var gid = txt.match(/[#?&]gid=(\d+)/);
  var pub = txt.match(/^https:\/\/docs\.google\.com\/spreadsheets\/d\/e\/[\w-]+\/pub/i);
  if (pub) return [txt.split('?')[0].replace(/pubhtml$/i, 'pub') + '?output=csv' + (gid ? '&gid=' + gid[1] : '')];
  var m = txt.match(/^https:\/\/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/i);
  if (!m) return [];
  var base = 'https://docs.google.com/spreadsheets/d/' + m[1];
  return [
    base + '/export?format=csv' + (gid ? '&gid=' + gid[1] : ''),
    base + '/gviz/tq?tqx=out:csv' + (gid ? '&gid=' + gid[1] : '')
  ];
}
async function buscarPlanilhaGoogle(link) {
  var urls = urlsPlanilhaGoogle(link);
  if (!urls.length) throw new Error('Esse link não parece ser de uma planilha do Google. Ele começa com https://docs.google.com/spreadsheets/d/...');
  for (var i = 0; i < urls.length; i++) {
    try {
      var r = await fetch(urls[i]);
      var t = await r.text();
      if (r.ok && t && !/^\s*<(!doctype|html)/i.test(t)) return t;
    } catch (e) { /* planilha privada: o Google bloqueia a leitura */ }
  }
  throw new Error('Não consegui abrir essa planilha. Confira se ela está compartilhada como "Qualquer pessoa com o link" (botão Compartilhar > Acesso geral). Se preferir, baixe como CSV e use "Escolher arquivo".');
}

async function abrirImportacao(arquivo) {
  if (!arquivo) return;
  var msgExcel = 'Esse é um arquivo do Excel. Abra ele, escolha Arquivo > Salvar como > CSV e suba o CSV aqui.';
  if (arquivo.size > 5 * 1024 * 1024) { toast('Esse arquivo é grande demais (o máximo é 5 MB).', true); return; }
  if (/\.xlsx?$/i.test(arquivo.name)) { toast(msgExcel, true); return; }
  var texto;
  try { texto = decodificarArquivo(await arquivo.arrayBuffer()); } catch (e) { toast('Não consegui ler esse arquivo.', true); return; }
  if (texto.slice(0, 2) === 'PK') { toast(msgExcel, true); return; }
  prepararImportacao(texto, arquivo.name);
}

/* Recebe o texto do CSV (de um arquivo ou do Google Planilhas), entende as colunas e abre a prévia */
function prepararImportacao(texto, origem) {
  texto = texto.replace(/^﻿/, '');
  var sep, mSep = texto.match(/^sep=(.)\r?\n/i);
  if (mSep) { sep = mSep[1]; texto = texto.slice(mSep[0].length); } else sep = detectarSep(texto);
  var linhas = lerCSV(texto, sep), cortou = false;
  if (!linhas.length) { toast('A planilha está vazia.', true); return; }
  if (linhas.length > 5001) { linhas = linhas.slice(0, 5001); cortou = true; }
  var ncol = linhas.reduce(function (m, l) { return Math.max(m, l.length); }, 0);

  var S = { temCab: cabecalhoReconhecido(linhas[0]), cab: [], dados: [], mapa: {}, novas: [] };
  function preparar() {
    var i;
    if (S.temCab) { S.cab = linhas[0].slice(); S.dados = linhas.slice(1); }
    else { S.cab = []; S.dados = linhas; }
    while (S.cab.length < ncol) S.cab.push('');
    S.mapa = autoMapa(S.cab, S.dados, S.temCab);
  }
  preparar();

  var html = '<div class="modal-topo"><h2>Importar planilha de marcas</h2><button class="ib" type="button" data-fechar aria-label="Fechar">' + ic('x') + '</button></div>' +
    '<p class="imp-arquivo"><b>' + esc(origem) + '</b> · ' + linhas.length + ' linhas lidas' + (cortou ? ' (só as 5.000 primeiras)' : '') + '</p>' +
    '<div class="imp-sub">Como entendi as colunas <span>confira e mude se precisar</span></div>' +
    '<div class="grade-form imp-mapa" id="imp-mapa"></div>' +
    '<div class="imp-opcoes">' +
      '<label><input type="checkbox" id="imp-cab"' + (S.temCab ? ' checked' : '') + '> A primeira linha da planilha é o título das colunas</label>' +
      '<label><input type="checkbox" id="imp-pular" checked> Pular marcas que já estão na minha base (mesmo e-mail, Instagram ou nome)</label>' +
      '<label><input type="checkbox" id="imp-juntar" checked> Guardar as outras colunas da planilha na observação</label>' +
      '<label class="imp-sit">Situação de quem não tiver essa informação: ' +
        '<select id="imp-sit">' + SITUACOES.map(function (s) { return '<option value="' + s.v + '">' + esc(s.t) + '</option>'; }).join('') + '</select></label>' +
    '</div>' +
    '<div class="imp-resumo" id="imp-resumo" role="status"></div>' +
    '<div class="imp-sub">Prévia</div><div class="rolagem imp-previa" id="imp-previa"></div>' +
    '<p class="erro-form" role="alert" hidden></p>' +
    '<div class="modal-rodape imp-rodape"><button class="btn" type="button" data-modelo>' + ic('baixar') + 'Baixar modelo</button><span class="espaco"></span>' +
      '<button class="btn" type="button" data-fechar>Cancelar</button><button class="btn primario" type="button" id="imp-ok">Importar</button></div>';
  var m = abrirModal(html, true);
  m.classList.add('imp-modal');

  function desenharMapa() {
    m.querySelector('#imp-mapa').innerHTML = CAMPOS_IMPORT.map(function (c) {
      var ops = '<option value="-1">— não tenho —</option>';
      for (var j = 0; j < ncol; j++) {
        var amostra = '';
        for (var i = 0; i < S.dados.length && !amostra; i++) amostra = String(S.dados[i][j] == null ? '' : S.dados[i][j]).trim();

   ========================================================== */
var PR_NOME = 'Lorena Sarnaglia';
var PR_EXEMPLO_MARCA = 'Aurora Cosméticos';
var PR_TEXTO_PADRAO = 'Oi, {{nome}}, tudo bem?\n\n' +

  'Um abraço,\nLorena Sarnaglia';

function prEmailDela() { return (window.BANCO && window.BANCO.EMAIL) || 'lorena.sarnaglia@gmail.com'; }

function prEstado() {
  if (!estado.pr) {
    var salvo = {};

}
function prSalvar() {

  try { localStorage.setItem('prospeccao', JSON.stringify({ assunto: p.assunto, texto: p.texto, botaoTexto: p.botaoTexto, botaoLink: p.botaoLink, html: p.html })); } catch (e) {}
}

/* ---------- Montar o e-mail ---------- */
function prPrimeiroNome(marca) {
  var limpo = String(marca || '').replace(/[@_]+/g, ' ').replace(/[^A-Za-zÀ-ÿ0-9\s.'&-]/g, ' ').trim();
  return limpo.split(/\s+/)[0] || '';
}
function prTrocar(txt, marca, comoHtml) {
  var nome = prPrimeiroNome(marca), inteira = String(marca || '');
  if (comoHtml) { nome = esc(nome); inteira = esc(inteira); }
  return String(txt || '')
    .replace(/\{\{\s*nome\s*\}\}/gi, function () { return nome; })
    .replace(/\{\{\s*marca\s*\}\}/gi, function () { return inteira; });
}
function prLinkOk(l) { return /^(https?:\/\/|mailto:)\S+$/i.test(String(l || '').trim()); }
function prCorpoHtml(texto) {
  var t = String(texto || '').replace(/\r\n?/g, '\n').trim();
  if (!t) return '';
  return t.split(/\n{2,}/).map(function (par) {
    var e = esc(par).replace(/(https?:\/\/[^\s<]*[^\s<.,;:!?)"'])/g, function (u) {
      return '<a href="' + u + '" style="color:#974315;text-decoration:underline">' + u + '</a>';
    });
    return '<p style="margin:0 0 16px 0">' + e.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}
/* O modelo pronto: fundo branco, letra escura, 560 px de largura, botão opcional e rodapé do SAIR */
function prHtmlDoTexto(texto, botaoTexto, botaoLink) {
  var botao = '';
  if (String(botaoTexto || '').trim() && prLinkOk(botaoLink)) {
    botao = '<tr><td style="padding:8px 0 24px 0"><a href="' + esc(String(botaoLink).trim()) + '" style="display:inline-block;background:#974315;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;text-decoration:none;padding:13px 26px;border-radius:8px">' + esc(String(botaoTexto).trim()) + '</a></td></tr>\n';
  }
  return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Mensagem de ' + PR_NOME + '</title>\n</head>\n' +
    '<body style="margin:0;padding:0;background:#ffffff;">\n' +
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">\n<tr><td align="center" style="padding:24px 16px;">\n' +
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">\n' +
    '<tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#222222;">' + prCorpoHtml(texto) + '</td></tr>\n' +
    botao +
    '<tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#8a8a8a;padding-top:20px;border-top:1px solid #eeeeee;">Se você não quiser receber mais e-mails meus, é só responder esta mensagem com a palavra SAIR.</td></tr>\n' +
    '</table>\n</td></tr>\n</table>\n</body>\n</html>';
}
/* O HTML do e-mail com as chaves ainda no lugar, no modo que estiver ligado */
function prHtmlModelo(p) {
  return p.modo === 'html' ? String(p.html || '') : prHtmlDoTexto(p.texto, p.botaoTexto, p.botaoLink);
}
function prHtmlParaTexto(html) {
  var d = new DOMParser().parseFromString(String(html || ''), 'text/html');
  Array.prototype.forEach.call(d.querySelectorAll('style,script,head,title'), function (n) { n.remove(); });
  Array.prototype.forEach.call(d.querySelectorAll('a[href]'), function (a) {
    var href = a.getAttribute('href'), t = (a.textContent || '').trim();
    a.textContent = (t && t !== href) ? t + ' (' + href + ')' : href;
  });
  Array.prototype.forEach.call(d.querySelectorAll('br'), function (b) { b.replaceWith('\n'); });
  Array.prototype.forEach.call(d.querySelectorAll('p,div,tr,li,h1,h2,h3,h4,h5,h6'), function (b) { b.append('\n'); });
  return (d.body.textContent || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}
/* Versão só texto (copiar e Gmail): o modo texto usa o que foi escrito, o modo HTML tira as etiquetas */
function prTextoSimples(p, marca) {
  if (p.modo === 'html') return prTrocar(prHtmlParaTexto(p.html), marca, false);
  var t = prTrocar(p.texto, marca, false).trim();
  if (String(p.botaoTexto || '').trim() && prLinkOk(p.botaoLink)) t += '\n\n' + String(p.botaoTexto).trim() + ': ' + String(p.botaoLink).trim();
  return t + '\n\nSe você não quiser receber mais e-mails meus, é só responder com a palavra SAIR.';
}
function prUrlGmail(email, assunto, corpo) {
  return 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(email) + '&su=' + encodeURIComponent(assunto) + '&body=' + encodeURIComponent(corpo);
}

/* ---------- Ler o que já existe no banco ---------- */
async function prLerTudo(tabela, colunas, ordem) {
  var todos = [];
  try {
    for (var pg = 0; pg < 10; pg++) {
      var q = sb.from(tabela).select(colunas);
      if (ordem) q = q.order(ordem, { ascending: false });
      var r = await q.range(pg * 1000, pg * 1000 + 999);
      if (r.error) return { ok: false, dados: [], erro: r.error };
      todos = todos.concat(r.data || []);
      if (!r.data || r.data.length < 1000) break;
    }
    return { ok: true, dados: todos };
  } catch (e) { return { ok: false, dados: [], erro: e }; }
}
async function prCarregar() {
  var res = await Promise.all([
    ler('marcas'),
    prLerTudo('email_envios', 'id,email,assunto,status,erro,resend_id,criado_em', 'criado_em'),
    prLerTudo('email_optout', 'email,criado_em', 'criado_em')
  ]);
  estado.marcas = res[0];
  estado.colSel = estado.marcas.length > 0 && ('selecionada' in estado.marcas[0]) && ('enviada_em' in estado.marcas[0]);
  estado.prTab = { envios: res[1].ok, optout: res[2].ok };
  estado.prEnvios = res[1].dados;
  estado.prOptRows = res[2].dados;
  estado.prOpt = new Set(res[2].dados.map(function (r) { return String(r.email).toLowerCase(); }));
}

/* ---------- Escolher para quem vai ---------- */
function prEmailOk(e) { return REGEX_EMAIL.test(String(e || '').trim()); }
function prMarcasBase() { return estado.marcas.filter(function (m) { return !m.exemplo; }); }
function prOpcoes() {
  var ops = [
    { v: 'selecionadas', t: 'Só as marcas que eu selecionei' },
    { v: 'teste', t: 'Só pra mim (teste)' },
    { v: 'todas', t: 'Todas as marcas que têm e-mail' }
  ];
  var vistos = {}, nomes = { lead: 'Só os leads', conversando: 'Só quem está conversando', cliente: 'Só quem já é cliente', parada: 'Só as paradas' };
  SITUACOES.forEach(function (s) { vistos[s.v] = s.t; });
  prMarcasBase().forEach(function (m) { if (m.situacao && !vistos[m.situacao]) vistos[m.situacao] = String(m.situacao); });
  Object.keys(vistos).forEach(function (s) { ops.push({ v: 'sit:' + s, t: nomes[s] || ('Só a situação: ' + vistos[s]) }); });
  return ops;
}
function prFiltroDest(dest) {
  if (dest === 'selecionadas') return function (m) { return !!m.selecionada; };
  if (String(dest).indexOf('sit:') === 0) { var s = dest.slice(4); return function (m) { return m.situacao === s; }; }
  return function () { return true; };
}
function prSelecao(dest) {
  if (dest === 'teste') {
    var primeira = prMarcasBase().filter(function (m) { return m.nome; })[0];
    return { teste: true, lista: [{ email: prEmailDela().toLowerCase(), marca: primeira ? primeira.nome : PR_EXEMPLO_MARCA, ids: [] }], semEmail: 0, duplicados: 0, marcasNoFiltro: 1 };
  }
  var base = prMarcasBase().filter(prFiltroDest(dest)), mapa = {}, lista = [], comEmail = 0;
  base.forEach(function (m) {
    var e = String(m.email || '').trim().toLowerCase();
    if (!prEmailOk(e)) return;
    comEmail++;
    if (mapa[e]) { mapa[e].ids.push(m.id); return; }
    mapa[e] = { email: e, marca: m.nome, ids: [m.id] };
    lista.push(mapa[e]);
  });
  return { teste: false, lista: lista, semEmail: base.length - comEmail, duplicados: comEmail - lista.length, marcasNoFiltro: base.length };
}
/* Tira quem pediu para sair e, se a caixinha estiver marcada, quem já recebeu este assunto */
function prAEnviar(p, sel) {
  var ja = {}, lista = [], optout = 0, jaRecebeu = 0;
  if (p.pular && !sel.teste) {
    var ass = String(p.assunto || '').trim();
    (estado.prEnvios || []).forEach(function (e) {
      if (e.status === 'ok' && String(e.assunto).trim() === ass) ja[String(e.email).toLowerCase()] = 1;
    });
  }
  sel.lista.forEach(function (x) {
    if (!sel.teste && estado.prOpt && estado.prOpt.has(x.email)) { optout++; return; }
    if (ja[x.email]) { jaRecebeu++; return; }
    lista.push(x);
  });
  return { lista: lista, optout: optout, jaRecebeu: jaRecebeu };
}
function prNomeLista(dest) {
  var o = prOpcoes().filter(function (x) { return x.v === dest; })[0];
  return o ? o.t.charAt(0).toLowerCase() + o.t.slice(1) : dest;
}

function prLigar(el) {
  if (el.__prLigado) return;
  el.__prLigado = true;
  var tempo = null;
  function agendar() { clearTimeout(tempo); tempo = setTimeout(prAtualizar, 120); }
  el.addEventListener('input', function (e) {
    var p = prEstado(), id = e.target.id;
    if (id === 'pr-assunto') p.assunto = e.target.value;
    else if (id === 'pr-texto') p.texto = e.target.value;
    else if (id === 'pr-html') p.html = e.target.value;
    else if (id === 'pr-botao-texto') p.botaoTexto = e.target.value;
    else if (id === 'pr-botao-link') p.botaoLink = e.target.value;
    else if (id === 'pr-busca') { p.busca = e.target.value; prHistorico(); return; }
    else return;
    prSalvar();
    agendar();
  });
  el.addEventListener('change', function (e) {
    var p = prEstado();
    if (e.target.id === 'pr-dest') { p.dest = e.target.value; prAtualizar(); }
    else if (e.target.id === 'pr-pular') { p.pular = e.target.checked; prAtualizar(); }
  });
  el.addEventListener('click', function (e) {
    var p = prEstado(), b = e.target.closest('button,[data-ir]');
    if (!b) return;
    if (b.hasAttribute('data-ir')) { irPara(b.getAttribute('data-ir')); return; }
    if (b.hasAttribute('data-canal')) { p.canal = b.getAttribute('data-canal'); prAtualizar(); return; }
    if (b.hasAttribute('data-modo')) { p.modo = b.getAttribute('data-modo'); prAtualizar(); return; }
    if (b.id === 'pr-modelo') { prComecarDoModelo(); return; }
    if (b.id === 'pr-cheia') { prTelaCheia(); return; }
    if (b.id === 'pr-teste') { prDisparar(true); return; }
    if (b.id === 'pr-disparar') { prDisparar(false); return; }
    if (b.id === 'pr-fila-btn') { prMontarFila(); return; }
    if (b.id === 'pr-opt-add') { prAdicionarSaida(); return; }
    if (b.hasAttribute('data-opt-tirar')) { prTirarSaida(b.getAttribute('data-opt-tirar')); return; }
    if (b.hasAttribute('data-fila')) { prFilaAcao(b.getAttribute('data-fila')); return; }
    if (b.hasAttribute('data-ver-marcas')) { irPara('marcas'); return; }
  });
}

/* ---------- Enviar pelo Resend ---------- */
function prProgresso(feitos, total, txt) {
  var el = estado.prEl;
  if (!el) return;
  var box = el.querySelector('#pr-progresso');
  box.hidden = false;
  el.querySelector('#pr-barra').style.width = (total ? Math.round(feitos * 100 / total) : 0) + '%';
  el.querySelector('#pr-prog-txt').textContent = txt || ('Enviados ' + feitos + ' de ' + total);
}
async function prTextoErro(err) {
  var msg = String((err && err.message) || err || ''), corpo = null;
  try { if (err && err.context && typeof err.context.json === 'function') corpo = await err.context.json(); } catch (e) {}
  if (corpo && corpo.codigo === 'sem_chave') return 'Falta guardar a chave do Resend no Supabase (segredo RESEND_API_KEY). Veja o passo a passo.';
  if (corpo && corpo.erro) return corpo.erro;
  if (/Failed to send a request|Failed to fetch|NetworkError|Load failed|not found|404/i.test(msg)) return 'Não consegui falar com a função enviar-emails. Ela já foi publicada no Supabase? Veja o passo a passo, ou use o modo Rascunho no Gmail.';
  return msg || 'Não consegui enviar.';
}
function prSoParaVoce(erros) {
  return erros.some(function (t) { return /only send testing emails|verify a domain|domain is not verified|own email/i.test(String(t)); });
}
async function prDisparar(teste) {
  var p = prEstado(), el = estado.prEl;
  if (p.ocupado) return;
  var assunto = String(p.assunto || '').trim(), modelo = prHtmlModelo(p);
  if (!assunto) { toast('Escreva o assunto do e-mail.', true); el.querySelector('#pr-assunto').focus(); return; }
  if (!String(modelo).trim() || (p.modo === 'texto' && !String(p.texto || '').trim())) { toast('Escreva o texto do e-mail.', true); return; }
  if (p.modo === 'html' && !/sair/i.test(p.html) && !(await confirmar('O HTML que você colou não tem o rodapé com a palavra SAIR. Quem não quiser mais receber não vai saber como pedir. Quer enviar assim mesmo?', 'Enviar assim mesmo'))) return;

  var sel = teste ? prSelecao('teste') : prSelecao(p.dest), env = teste ? { lista: sel.lista, optout: 0, jaRecebeu: 0 } : prAEnviar(p, sel);
  if (!teste) {
    if (p.dest === 'selecionadas' && !prMarcasBase().some(function (m) { return m.selecionada; })) { toast('Você ainda não selecionou nenhuma marca. Escolha na aba Marcas.', true); return; }
    if (!env.lista.length) { toast('Não tem ninguém para receber com essas configurações.', true); return; }
    var ok = await confirmar('Vai para ' + prPlural(env.lista.length, 'marca', 'marcas') + ', da lista "' + prNomeLista(p.dest) + '", e não dá pra desfazer.', 'Enviar agora');
    if (!ok) return;
  }

  p.ocupado = true; prAtualizar();
  el.querySelector('#pr-resumo').innerHTML = '';
  var agg = { enviados: 0, falhas: 0, pulados: 0, cota: false, faltaram: 0, erros: [], erroGeral: '' }, okEmails = {};
  var total = env.lista.length;
  prProgresso(0, total, 'Começando...');
  try {
    for (var i = 0; i < total; i += 100) {
      var lote = env.lista.slice(i, i + 100);
      var r = await sb.functions.invoke('enviar-emails', { body: { destinatarios: lote.map(function (x) { return { email: x.email, marca: x.marca }; }), assunto: assunto, html: modelo, teste: !!teste } });
      if (r.error) { agg.erroGeral = await prTextoErro(r.error); break; }
      var d = r.data || {};
      if (d.erro) { agg.erroGeral = d.erro; break; }
      agg.enviados += d.enviados || 0; agg.falhas += d.falhas || 0; agg.pulados += d.pulados || 0;
      (d.resultados || []).forEach(function (x) {
        if (x.status === 'ok') okEmails[String(x.email).toLowerCase()] = 1;
        if (x.status === 'erro' && x.erro) agg.erros.push(x.erro);
      });
      if (d.cota_acabou) { agg.cota = true; agg.faltaram = (d.faltaram || 0) + (total - i - lote.length); }
      prProgresso(Math.min(i + lote.length, total), total, 'Enviados ' + agg.enviados + ' de ' + total);
      if (!teste) {
        var ids = [];
        lote.forEach(function (x) { if (okEmails[x.email]) ids = ids.concat(x.ids); });
        await prMarcarEnviadas(ids);
      }
      if (agg.cota) break;
    }
  } catch (err) { agg.erroGeral = await prTextoErro(err); }
  p.ocupado = false;

  await prCarregar();
  prAtualizar(); prHistorico(); prListaSaida();
  prResumo(agg, teste, total);
  if (!teste && agg.enviados > 0 && prMarcasBase().some(function (m) { return m.selecionada; })) {
    if (await confirmar('Quer limpar a sua seleção de marcas agora? Se você for mandar a mesma lista de novo, é melhor manter.', 'Limpar seleção')) await prLimparSelecao();
  }
}
function prResumo(agg, teste, total) {
  var el = estado.prEl, h = '';
  if (agg.erroGeral) h += '<div class="pr-alerta pr-erro" role="alert"><b>O envio parou.</b> ' + esc(agg.erroGeral) + '</div>';
  if (agg.cota) {
    h += '<div class="pr-alerta pr-erro" role="alert"><b>A cota diária do Resend acabou.</b> O envio parou de propósito, para não tentar à toa. ' +
      'Foram enviados ' + agg.enviados + ' e ficaram faltando ' + agg.faltaram + '. <b>Volte amanhã</b>, cole o mesmo assunto e o mesmo texto e deixe marcada a caixinha "Pular quem já recebeu este mesmo assunto". Assim ele manda só para quem faltou.</div>';
  }
  if (agg.erros.length && prSoParaVoce(agg.erros)) {
    h += '<div class="pr-alerta pr-erro" role="alert">O Resend só deixa mandar para o seu próprio e-mail enquanto você não verificar um domínio seu. Por enquanto, use o modo <b>Rascunho no Gmail</b>.</div>';
  }
  if (!agg.erroGeral || agg.enviados || agg.falhas || agg.pulados) {
    h += '<div class="pr-final"><div><strong>' + agg.enviados + '</strong><span>' + (teste ? 'teste enviado' : 'enviados') + '</span></div><div><strong>' + agg.falhas + '</strong><span>falhas</span></div><div><strong>' + agg.pulados + '</strong><span>pulados</span></div></div>';
  }
  if (teste && agg.enviados) h += '<p class="pr-dica">Teste enviado para ' + esc(prEmailDela()) + '. Abra no celular e confira se o nome da marca entrou nos lugares certos.</p>';
  el.querySelector('#pr-resumo').innerHTML = h;
}

/* ---------- Marcar como enviada ---------- */

  if (!ids || !ids.length || !estado.colSel) return;
  var dia = iso(hoje()), unicos = [];
  ids.forEach(function (id) { if (unicos.indexOf(id) < 0) unicos.push(id); });
  try {

      await gravar('marcas', sb.from('marcas').update({ enviada_em: dia }).in('id', unicos.slice(i, i + 200)));
    }
    estado.marcas.forEach(function (m) { if (unicos.indexOf(m.id) >= 0) m.enviada_em = dia; });

}
async function prLimparSelecao() {

  try {
    for (var i = 0; i < ids.length; i += 200) await gravar('marcas', sb.from('marcas').update({ selecionada: false }).in('id', ids.slice(i, i + 200)));
