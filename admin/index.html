async function prFilaAcao(acao) {
  var p = prEstado(), f = p.fila;
  if (!f) return;
  if (acao === 'fechar') { p.fila = null; prFilaDesenhar(); prAtualizar(); return; }
  var it = f.itens[f.i];
  if (!it) return;
  if (acao === 'copiar') {
    var t = estado.prEl.querySelector('#pr-fila-texto');
    try { await navigator.clipboard.writeText(t.value); toast('Texto copiado.'); }
    catch (e) { t.select(); try { document.execCommand('copy'); toast('Texto copiado.'); } catch (e2) { toast('Não consegui copiar. Selecione o texto e use Ctrl+C.', true); } }
    return;
  }
  if (acao === 'pular') { f.puladas++; f.i++; prFilaDesenhar(); return; }
  if (acao === 'enviada') {
    await prMarcarEnviadas(it.ids);
    if (estado.prTab.envios) {
      try {
        var linha = { email: it.email, assunto: String(p.assunto || '').trim(), status: 'ok', resend_id: 'rascunho-gmail' };
        var r = await sb.from('email_envios').insert(linha);
        if (!r.error) estado.prEnvios.unshift({ id: 'novo', email: linha.email, assunto: linha.assunto, status: 'ok', erro: null, resend_id: linha.resend_id, criado_em: new Date().toISOString() });
      } catch (e) { /* o registro é um extra */ }
    }
    f.feitos++; f.i++;
    prFilaDesenhar(); prAtualizar(); prHistorico();
  }
}

/* ---------- Histórico e lista de saída ---------- */
function prDataHora(s) {
  var d = new Date(s);
  if (isNaN(d.getTime())) return '';
  function z(n) { return n < 10 ? '0' + n : '' + n; }
  return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function prHistorico() {
  var alvo = estado.prEl && estado.prEl.querySelector('#pr-hist');
  if (!alvo) return;
  if (!estado.prTab.envios) { alvo.innerHTML = '<p class="vazio">O histórico aparece aqui depois que você rodar o disparo.sql no Supabase.</p>'; return; }
  var q = norm(prEstado().busca).trim();
  var lista = (estado.prEnvios || []).filter(function (e) { return !q || norm(e.email).indexOf(q) >= 0; });
  if (!lista.length) { alvo.innerHTML = '<p class="vazio">' + (q ? 'Nenhum envio com esse e-mail.' : 'Nada foi enviado ainda. Depois do primeiro envio, tudo aparece aqui.') + '</p>'; return; }
  var mostrar = lista.slice(0, 300);
  alvo.innerHTML = '<div class="rolagem"><table><thead><tr><th>Para</th><th>Assunto</th><th>Quando</th><th>Situação</th></tr></thead><tbody>' +
    mostrar.map(function (e) {
      return '<tr><td class="nb">' + esc(e.email) + '</td><td>' + esc(e.assunto) + '</td><td class="nb">' + esc(prDataHora(e.criado_em)) + '</td><td>' +
        (e.status === 'ok' ? '<span class="pil p-pago">enviado</span>' : '<span class="pil pr-pil-erro">erro</span> <small class="pr-erro-txt">' + esc(e.erro || '') + '</small>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' + (lista.length > mostrar.length ? '<p class="pr-dica">Mostrando os 300 mais recentes de ' + lista.length + '. Use a busca para achar um e-mail.</p>' : '');
}
function prListaSaida() {
  var alvo = estado.prEl && estado.prEl.querySelector('#pr-opt-lista');
  if (!alvo) return;
  if (!estado.prTab.optout) { alvo.innerHTML = '<p class="vazio">A lista de saída funciona depois que você rodar o disparo.sql no Supabase.</p>'; return; }
  var rows = estado.prOptRows || [];
  alvo.innerHTML = rows.length ? '<ul class="pr-saidas">' + rows.map(function (r) {
    return '<li><span>' + esc(r.email) + '</span><button class="ib perigo" type="button" data-opt-tirar="' + esc(r.email) + '" aria-label="Tirar ' + esc(r.email) + ' da lista de saída" title="Tirar da lista">' + ic('x') + '</button></li>';
  }).join('') + '</ul>' : '<p class="pr-dica">Ninguém pediu para sair ainda.</p>';
}
async function prAdicionarSaida() {
  var campo = estado.prEl.querySelector('#pr-opt-email'), e = String(campo.value || '').trim().toLowerCase();
  if (!estado.prTab.optout) { toast('Rode o disparo.sql no Supabase primeiro.', true); return; }
  if (!prEmailOk(e)) { toast('Escreva um e-mail válido.', true); campo.focus(); return; }
  try {
    await gravar('email_optout', sb.from('email_optout').upsert({ email: e }));
    campo.value = '';
    await prCarregar();
    prAtualizar(); prListaSaida();
    toast('Pronto. Esse e-mail nunca mais recebe nada seu.');
  } catch (err) { toast(err.message, true); }
}
async function prTirarSaida(email) {
  if (!(await confirmar('Tirar "' + email + '" da lista de saída? Ele volta a poder receber e-mails seus.', 'Tirar da lista'))) return;
  try {
    await gravar('email_optout', sb.from('email_optout').delete().eq('email', String(email).toLowerCase()));
    await prCarregar();
    prAtualizar(); prListaSaida();
    toast('Removido da lista de saída.');
  } catch (err) { toast(err.message, true); }
}

/* ==========================================================
   7) CALENDÁRIO
   ========================================================== */
var MESES_ABREV = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

async function telaCalendario(el) {
  var res = await Promise.all([ler('calendario'), ler('campanhas'), ler('marcas')]);
  estado.cal = res[0]; estado.camp = res[1]; estado.marcas = res[2];
  if (!estado.calNav) { var h = hoje(); estado.calNav = { ano: h.getFullYear(), mes: h.getMonth(), filtro: 'todos' }; }
  el.innerHTML = '<div id="cal-topo"></div><div id="cal-grade"></div><div id="cal-atras"></div>';
  desenharCalendario();
}

function itensDoDia(dia) {
  var f = estado.calNav.filtro, out = [];
  estado.camp.forEach(function (c) { if (f === 'todos' && c.prazo === dia) out.push({ k: 'prazo', r: c }); });
  estado.cal.forEach(function (r) { if (r.data === dia && (f === 'todos' || r.tipo === f)) out.push({ k: 'cal', r: r }); });
  return out;
}

function chipHTML(it) {
  if (it.k === 'prazo') {
    return '<button type="button" class="chip prazo' + (it.r.status === 'Entregue' ? ' feito' : '') + '" data-prazo="' + esc(it.r.id) + '" title="Prazo da campanha: ' + esc(it.r.campanha) + '">Prazo: ' + esc(it.r.campanha) + '</button>';
  }
  return '<button type="button" class="chip ' + esc(it.r.tipo) + (it.r.status === 'feito' ? ' feito' : '') + '" data-cal="' + esc(it.r.id) + '" title="' + esc(it.r.titulo) + '">' + esc(it.r.titulo) + '</button>';
}

function desenharCalendario() {
  var n = estado.calNav, h = hoje(), hojeISO = iso(h);
  var primeiro = new Date(n.ano, n.mes, 1);
  var desloc = (primeiro.getDay() + 6) % 7;
  var diasMes = new Date(n.ano, n.mes + 1, 0).getDate();
  var semanas = Math.ceil((desloc + diasMes) / 7);
  var titulo = primeiro.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  titulo = titulo.charAt(0).toUpperCase() + titulo.slice(1);

  $('#cal-topo').innerHTML =
    '<div class="barra">' +
      '<button class="btn" type="button" id="c-ant" aria-label="Mês anterior">' + ic('esq') + '</button>' +
      '<strong style="min-width:150px;text-align:center" aria-live="polite">' + esc(titulo) + '</strong>' +
      '<button class="btn" type="button" id="c-prox" aria-label="Próximo mês">' + ic('dir') + '</button>' +
      '<button class="btn" type="button" id="c-hoje">Este mês</button><span class="espaco"></span>' +
      '<div class="seg" role="group" aria-label="Filtrar por tipo">' +
        [{ v: 'todos', t: 'Todos' }].concat(TIPOS_CAL).map(function (t) { return '<button type="button" data-f="' + t.v + '" aria-pressed="' + (n.filtro === t.v) + '">' + t.t + '</button>'; }).join('') + '</div>' +
      '<button class="btn primario" type="button" id="c-novo">' + ic('plus') + 'Adicionar</button></div>';

  var cab = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map(function (d) { return '<span>' + d + '</span>'; }).join('');
  var cel = '';
  for (var i = 0; i < semanas * 7; i++) {
    var d = new Date(n.ano, n.mes, 1 - desloc + i), di = iso(d), fora = d.getMonth() !== n.mes;
    var its = itensDoDia(di);
    var nomeDia = d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
    cel += '<div class="dia' + (fora ? ' fora' : '') + (di === hojeISO ? ' hoje' : '') + '" data-dia="' + di + '">' +
      '<span class="dnum">' + d.getDate() + '</span>' +
      '<button type="button" class="mais-add" data-add="' + di + '" aria-label="Adicionar em ' + esc(nomeDia) + '">' + ic('plus') + '</button>' +
      its.slice(0, 3).map(chipHTML).join('') +
      (its.length > 3 ? '<button type="button" class="chip-mais" data-lista="' + di + '">+' + (its.length - 3) + ' mais</button>' : '') + '</div>';
  }
  $('#cal-grade').innerHTML = '<div class="cal-rolagem"><div class="cal-cab">' + cab + '</div><div class="cal-grade">' + cel + '</div></div>';

  /* Ficou pra trás */
  var atras = estado.cal.filter(function (r) { return r.status !== 'feito' && r.data && r.data < hojeISO; })
    .sort(function (a, b) { return a.data < b.data ? -1 : 1; });
  $('#cal-atras').innerHTML = '<div class="cartao pra-tras" style="margin-top:18px"><h2>Ficou pra trás</h2>' +
    (atras.length ? atras.map(function (r) {
      var dd = difDias(h, parseISO(r.data));
      return '<div class="item"><span class="pil p-' + (r.tipo === 'gravar' ? 'conversando' : r.tipo === 'editar' ? 'lead' : 'cliente') + '">' + esc(r.tipo) + '</span>' +
        '<span style="flex:1;min-width:120px"><b>' + esc(r.titulo) + '</b>' + (r.marca ? ' <span style="color:var(--azul)">' + esc(r.marca) + '</span>' : '') + '</span>' +
        '<span class="quando">' + fmtData(r.data) + ', há ' + plural(dd, 'dia', 'dias') + '</span>' +
        '<button class="btn" type="button" data-feito="' + esc(r.id) + '">' + ic('ok') + 'Marcar como feito</button>' +
        '<button class="ib" type="button" data-cal="' + esc(r.id) + '" aria-label="Editar">' + ic('lapis') + '</button></div>';
    }).join('') : '<p class="vazio" style="padding:10px 0;text-align:left">Nada atrasado. Tudo em dia.</p>') + '</div>';
}

function pegarCal(id) { return estado.cal.filter(function (x) { return String(x.id) === String(id); })[0]; }

/* Cliques do calendário: um ouvinte só, ligado uma vez, que confere se a aba do calendário está aberta */
document.addEventListener('click', async function (e) {
  if (estado.aba !== 'calendario' || !$('#cal-topo') || modalAtual) return;
  var n = estado.calNav; if (!n) return;
  var b;
  if (e.target.closest('#c-ant')) { n.mes--; if (n.mes < 0) { n.mes = 11; n.ano--; } return desenharCalendario(); }
  if (e.target.closest('#c-prox')) { n.mes++; if (n.mes > 11) { n.mes = 0; n.ano++; } return desenharCalendario(); }
  if (e.target.closest('#c-hoje')) { var h = hoje(); n.ano = h.getFullYear(); n.mes = h.getMonth(); return desenharCalendario(); }
  if (e.target.closest('#c-novo')) return formCalendario(null, iso(hoje()));
  if ((b = e.target.closest('[data-f]'))) { n.filtro = b.getAttribute('data-f'); return desenharCalendario(); }
  if ((b = e.target.closest('[data-feito]'))) {
    try { await gravar('calendario', sb.from('calendario').update({ status: 'feito' }).eq('id', b.getAttribute('data-feito'))); toast('Marcado como feito.'); desenharTela(); }
    catch (err) { toast(err.message, true); }
    return;
  }
  if ((b = e.target.closest('[data-cal]'))) { var r = pegarCal(b.getAttribute('data-cal')); if (r) formCalendario(r); return; }
  if ((b = e.target.closest('[data-prazo]'))) { infoPrazo(b.getAttribute('data-prazo')); return; }
  if ((b = e.target.closest('[data-lista]'))) { listaDoDia(b.getAttribute('data-lista')); return; }
  if ((b = e.target.closest('[data-add]'))) { formCalendario(null, b.getAttribute('data-add')); return; }
  if ((b = e.target.closest('.dia'))) { formCalendario(null, b.getAttribute('data-dia')); }
});

function listaDoDia(dia) {
  var its = itensDoDia(dia);
  var d = parseISO(dia).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  var m = abrirModal('<div class="modal-topo"><h2>' + esc(d.charAt(0).toUpperCase() + d.slice(1)) + '</h2><button class="ib" type="button" data-fechar aria-label="Fechar">' + ic('x') + '</button></div>' +
    '<div class="lista-dia">' + (its.length ? its.map(function (it) {
      return '<div class="item">' + chipHTML(it).replace('class="chip', 'style="width:auto;flex:1;margin:0" class="chip') + '</div>';
    }).join('') : '<p class="vazio">Nada neste dia.</p>') + '</div>' +
    '<div class="modal-rodape"><span class="espaco"></span><button class="btn primario" type="button" data-novo>' + ic('plus') + 'Adicionar neste dia</button></div>');
  m.addEventListener('click', function (e) {
    var b;
    if (e.target.closest('[data-novo]')) { formCalendario(null, dia); return; }
    if ((b = e.target.closest('[data-cal]'))) { var r = pegarCal(b.getAttribute('data-cal')); if (r) formCalendario(r); return; }
    if ((b = e.target.closest('[data-prazo]'))) { infoPrazo(b.getAttribute('data-prazo')); }
  });
}

function infoPrazo(id) {
  var c = estado.camp.filter(function (x) { return String(x.id) === String(id); })[0];
  if (!c) return;
  var m = abrirModal('<div class="modal-topo"><h2>Prazo de campanha</h2><button class="ib" type="button" data-fechar aria-label="Fechar">' + ic('x') + '</button></div>' +
    '<p><b>' + esc(c.campanha) + '</b>' + (c.cliente ? ' para ' + esc(c.cliente) : '') + '</p>' +
    '<p style="margin-top:6px">Prazo: ' + fmtData(c.prazo) + '. Status: ' + esc(c.status) + '.</p>' +
    '<p class="legenda" style="margin-top:6px;color:var(--azul)">Este item vem da aba Campanhas. Para mudar a data, edite a campanha.</p>' +
    '<div class="modal-rodape"><span class="espaco"></span><button class="btn primario" type="button" data-ir>Abrir em Campanhas</button></div>');
  m.querySelector('[data-ir]').addEventListener('click', function () { fecharModal(true); irPara('campanhas'); });
}

function formCalendario(r, dia) {
  formulario({
    titulo: r ? 'Editar item' : 'Adicionar ao calendário',
    valores: r || { data: dia, tipo: 'gravar', status: 'a fazer' },
    campos: [
      { k: 'titulo', label: 'Título', obrigatorio: true, larga: true },
      { k: 'marca', label: 'Marca', lista: estado.marcas.map(function (m) { return m.nome; }) },
      { k: 'tipo', label: 'Tipo', tipo: 'select', opcoes: TIPOS_CAL },
      { k: 'data', label: 'Data', tipo: 'date', obrigatorio: true },
      { k: 'status', label: 'Status', tipo: 'select', opcoes: [{ v: 'a fazer', t: 'A fazer' }, { v: 'feito', t: 'Feito' }] }
    ],
    onSalvar: async function (d) {
      var dados = { titulo: d.titulo, marca: d.marca, tipo: d.tipo, data: d.data, status: d.status };
      if (r) await gravar('calendario', sb.from('calendario').update(dados).eq('id', r.id));
      else await gravar('calendario', sb.from('calendario').insert(dados));
      toast('Calendário salvo.'); desenharTela();
    },
    onApagar: r ? async function () { await gravar('calendario', sb.from('calendario').delete().eq('id', r.id)); toast('Item apagado.'); desenharTela(); } : null,
    textoApagar: 'Apagar este item do calendário?'
  });
}

/* ==========================================================
   8) CAMPANHAS
   ========================================================== */
var COLUNAS_CAMP = [
  { k: 'favorita', t: '', rotulo: 'Favoritas' }, { k: 'campanha', t: 'Campanha' }, { k: 'cliente', t: 'Cliente' },
  { k: 'tipo', t: 'Tipo' }, { k: 'status', t: 'Status' }, { k: 'qtd', t: 'Qtd', num: true },
  { k: 'valor', t: 'Valor', num: true }, { k: 'prazo', t: 'Prazo' }, { k: 'pagamento', t: 'Pagamento' }
];

async function telaCampanhas(el) {
  var res = await Promise.all([ler('campanhas'), ler('marcas')]);
  estado.camp = res[0]; estado.marcas = res[1];
  var reais = estado.camp.filter(function (c) { return !c.exemplo; });
  var total = reais.length, ativas = reais.filter(function (c) { return c.ativa !== false; }).length;
  var soma = 0, videos = 0, receber = 0, recebido = 0;
  reais.forEach(function (c) {
    var v = Number(c.valor) || 0;
    soma += v; videos += Number(c.qtd) || 0;
    if (c.pagamento === 'pago') recebido += v; else receber += v;
  });
  var ticket = videos > 0 ? soma / videos : 0;

  el.innerHTML =
    '<div class="metricas">' +
      '<div class="metrica"><span class="rot">Campanhas</span><span class="val">' + total + '</span></div>' +
      '<div class="metrica"><span class="rot">Ativas</span><span class="val">' + ativas + '</span></div>' +
      '<div class="metrica"><span class="rot">Valor total</span><span class="val">' + moeda(soma) + '</span><span class="sub">ticket médio por vídeo: ' + moeda(ticket) + '</span></div>' +
      '<div class="metrica"><span class="rot">A receber</span><span class="val">' + moeda(receber) + '</span><span class="sub">já recebido: ' + moeda(recebido) + '</span></div>' +
    '</div>' +
    '<div class="barra">' +
      '<div class="seg" role="group" aria-label="Filtrar campanhas">' + [['todas', 'Todas'], ['ativas', 'Ativas'], ['finalizadas', 'Finalizadas']].map(function (f) {
        return '<button type="button" data-cf="' + f[0] + '" aria-pressed="' + (estado.campFiltro === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div>' +
      '<div class="busca">' + ic('busca') + '<input type="search" id="k-busca" placeholder="Buscar campanha ou cliente" aria-label="Buscar campanha" value="' + esc(estado.campBusca) + '"></div>' +
      '<span class="espaco"></span>' +
      '<button class="btn" type="button" id="k-csv">' + ic('baixar') + 'Baixar</button>' +
      '<button class="btn primario" type="button" id="k-novo">' + ic('plus') + 'Adicionar campanha</button></div>' +
    '<div id="k-tabela"></div>';

  $('.seg', el).addEventListener('click', function (e) {
    var b = e.target.closest('[data-cf]');
    if (b) { estado.campFiltro = b.getAttribute('data-cf'); $$('[data-cf]', el).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); desenharCampanhas(); }
  });
  $('#k-busca').addEventListener('input', function (e) { estado.campBusca = e.target.value; desenharCampanhas(); });
  $('#k-novo').addEventListener('click', function () { formCampanha(null); });
  $('#k-csv').addEventListener('click', function () {
    var linhas = reais.map(function (c) {
      return [c.campanha, c.cliente, c.tipo, c.status, c.qtd, String(Number(c.valor) || 0).replace('.', ','), fmtData(c.prazo), c.pagamento, c.ativa === false ? 'Não' : 'Sim', c.favorita ? 'Sim' : 'Não'];
    });
    if (!linhas.length) { toast('Ainda não tem campanhas para baixar (a linha de exemplo não entra no arquivo).', true); return; }
    baixarCSV('campanhas', ['Campanha', 'Cliente', 'Tipo', 'Status', 'Qtd', 'Valor', 'Prazo', 'Pagamento', 'Ativa', 'Favorita'], linhas);
  });
  desenharCampanhas();
}

function valorOrdem(c, col) {
  switch (col) {
    case 'favorita': return c.favorita ? 0 : 1;
    case 'status': var i = FUNIL.indexOf(c.status); return i < 0 ? 99 : i; /* segue o funil, nunca o alfabeto */
    case 'qtd': return Number(c.qtd) || 0;
    case 'valor': return Number(c.valor) || 0;
    case 'prazo': return c.prazo || '';
    default: return norm(c[col]);
  }
}

function desenharCampanhas() {
  var alvo = $('#k-tabela');
  if (!alvo) return;
  var q = norm(estado.campBusca), o = estado.campOrd, h = hoje();
  var lista = estado.camp.filter(function (c) {
    if (estado.campFiltro === 'ativas' && c.ativa === false) return false;
    if (estado.campFiltro === 'finalizadas' && c.ativa !== false) return false;
    return !q || norm(c.campanha).indexOf(q) >= 0 || norm(c.cliente).indexOf(q) >= 0;
  });
  lista.sort(function (a, b) {
    var va = valorOrdem(a, o.col), vb = valorOrdem(b, o.col);
    if (o.col === 'prazo') { /* sem prazo vai sempre para o fim */
      if (!va && !vb) return 0; if (!va) return 1; if (!vb) return -1;
    }
    var r = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'pt-BR');
    return r * o.dir;
  });
  if (!estado.camp.length) { alvo.innerHTML = '<div class="cartao"><p class="vazio">Nenhuma campanha ainda. Clique em "Adicionar campanha".</p></div>'; return; }
  if (!lista.length) { alvo.innerHTML = '<div class="cartao"><p class="vazio">Nenhuma campanha encontrada com esse filtro ou busca.</p></div>'; return; }

  alvo.innerHTML = '<div class="rolagem"><table><thead><tr>' + COLUNAS_CAMP.map(function (c) {
    var ativo = o.col === c.k;
    var seta = ativo ? (o.dir === 1 ? 'asc' : 'desc') : 'ordem';
    return '<th class="' + (c.num ? 'num' : '') + '" aria-sort="' + (ativo ? (o.dir === 1 ? 'ascending' : 'descending') : 'none') + '">' +
      '<button type="button" data-ord="' + c.k + '"' + (c.rotulo ? ' aria-label="Ordenar por ' + c.rotulo + '"' : '') + '>' + (c.k === 'favorita' ? ic('estrela') : esc(c.t)) + ic(seta) + '</button></th>';
  }).join('') + '</tr></thead><tbody>' + lista.map(function (c) {
    var iStatus = Math.max(0, FUNIL.indexOf(c.status));
    var aviso = '';
    if (c.prazo && c.status !== 'Entregue') {
      var dd = difDias(parseISO(c.prazo), h);
      if (dd < 0) aviso = '<span class="et vermelha">atrasado ' + plural(-dd, 'dia', 'dias') + '</span>';
      else if (dd <= 3) aviso = '<span class="et amarela">' + (dd === 0 ? 'vence hoje' : 'vence em ' + plural(dd, 'dia', 'dias')) + '</span>';
    }
    return '<tr data-id="' + esc(c.id) + '" class="' + (c.favorita ? 'fav' : '') + '">' +
      '<td><button class="ib' + (c.favorita ? ' on' : '') + '" type="button" data-fav="1" aria-pressed="' + !!c.favorita + '" aria-label="Destacar campanha">' + ic('estrela') + '</button></td>' +
      '<td><button class="linkbtn" type="button" data-editar="1">' + esc(c.campanha) + '</button>' + (c.exemplo ? '<span class="pil p-exemplo">exemplo</span>' : '') + '</td>' +
      '<td>' + esc(c.cliente) + '</td>' +
      '<td><span class="pil p-' + (c.tipo === 'Publicidade' ? 'publicidade' : 'conteudo') + '">' + esc(c.tipo) + '</span></td>' +
      '<td><span class="pil p-s' + iStatus + '">' + esc(c.status) + '</span></td>' +
      '<td class="num">' + (Number(c.qtd) || 0) + '</td>' +
      '<td class="num">' + moeda(c.valor) + '</td>' +
      '<td>' + fmtData(c.prazo) + aviso + '</td>' +
      '<td><span class="pil p-' + (c.pagamento === 'pago' ? 'pago' : 'pendente') + '">' + (c.pagamento === 'pago' ? 'Pago' : 'Pendente') + '</span></td></tr>';
  }).join('') + '</tbody></table></div>';

  $('thead', alvo).addEventListener('click', function (e) {
    var b = e.target.closest('[data-ord]');
    if (!b) return;
    var col = b.getAttribute('data-ord');
    if (estado.campOrd.col === col) estado.campOrd.dir *= -1; else estado.campOrd = { col: col, dir: 1 };
    desenharCampanhas();
  });
  $('tbody', alvo).addEventListener('click', async function (e) {
    var tr = e.target.closest('tr[data-id]');
    if (!tr) return;
    var c = estado.camp.filter(function (x) { return String(x.id) === tr.getAttribute('data-id'); })[0];
    if (!c) return;
    if (e.target.closest('[data-fav]')) {
      var novo = !c.favorita;
      try { await gravar('campanhas', sb.from('campanhas').update({ favorita: novo }).eq('id', c.id)); c.favorita = novo; desenharCampanhas(); }
      catch (err) { toast(err.message, true); }
      return;
    }
    formCampanha(c);
  });
}

function formCampanha(c) {
  formulario({
    titulo: c ? 'Editar campanha' : 'Adicionar campanha',
    valores: c ? Object.assign({}, c, { valor: String(c.valor == null ? '' : c.valor).replace('.', ',') }) : { tipo: 'Conteúdo', status: 'Briefing', qtd: 1, pagamento: 'pendente', ativa: true },
    campos: [
      { k: 'campanha', label: 'Campanha', obrigatorio: true, larga: true },
      { k: 'cliente', label: 'Cliente', lista: estado.marcas.map(function (m) { return m.nome; }) },
      { k: 'tipo', label: 'Tipo', tipo: 'select', opcoes: [{ v: 'Conteúdo', t: 'Conteúdo' }, { v: 'Publicidade', t: 'Publicidade' }] },
      { k: 'status', label: 'Status', tipo: 'select', opcoes: FUNIL.map(function (s) { return { v: s, t: s }; }) },
      { k: 'qtd', label: 'Quantidade de vídeos', tipo: 'number' },
      { k: 'valor', label: 'Valor (R$)', dica: '1500,00' },
      { k: 'prazo', label: 'Prazo', tipo: 'date' },
      { k: 'pagamento', label: 'Pagamento', tipo: 'select', opcoes: [{ v: 'pendente', t: 'Pendente' }, { v: 'pago', t: 'Pago' }] },
      { k: 'ativa', label: 'Campanha ativa', tipo: 'checkbox' },
      { k: 'favorita', label: 'Destacar com estrela', tipo: 'checkbox' }
    ],
    onSalvar: async function (d) {
      var dados = { campanha: d.campanha, cliente: d.cliente, tipo: d.tipo, status: d.status, qtd: parseInt(d.qtd, 10) || 0, valor: parseValor(d.valor), prazo: d.prazo || null, pagamento: d.pagamento, ativa: d.ativa, favorita: d.favorita };
      if (c) await gravar('campanhas', sb.from('campanhas').update(dados).eq('id', c.id));
      else await gravar('campanhas', sb.from('campanhas').insert(dados));
      toast('Campanha salva.'); desenharTela();
    },
    onApagar: c ? async function () { await gravar('campanhas', sb.from('campanhas').delete().eq('id', c.id)); toast('Campanha apagada.'); desenharTela(); } : null,
    textoApagar: 'Apagar esta campanha? Não dá para desfazer.'
  });
}

/* ==========================================================
   9) CHECKLIST PORTFÓLIO (conteúdo vem de js/biblioteca.js)
   ========================================================== */
var SUBABAS = [
  { k: 'checklist', t: 'Checklist do portfólio' }, { k: 'referencias', t: 'Referências de vídeo' },
  { k: 'roteiros', t: 'Roteiros' }, { k: 'nichos', t: 'Ideias por nicho' }, { k: 'revisar', t: 'Revisar meu roteiro' }
];

async function telaChecklist(el) {
  var B = window.Biblioteca;
  if (!B) {
    el.innerHTML = '<div class="cartao"><h2>Não achei o conteúdo do checklist</h2><p>O arquivo js/biblioteca.js não foi carregado. Confira se ele está na pasta js do projeto.</p></div>';
    return;
  }
  /* o que já foi marcado */
  var linhas = await ler('marcados');
  estado.marcados = new Set(linhas.map(function (l) { return l.chave; }));
  el.innerHTML = '<div class="subabas" role="tablist" aria-label="Partes do checklist">' + SUBABAS.map(function (s) {
    return '<button type="button" role="tab" data-sub="' + s.k + '" aria-selected="' + (estado.ckAba === s.k) + '">' + esc(s.t) + '</button>';
  }).join('') + '</div><div id="ck-corpo"></div>';
  el.querySelector('.subabas').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sub]');
    if (!b) return;
    estado.ckAba = b.getAttribute('data-sub');
    $$('[data-sub]', el).forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
    desenharSub();
  });

  /* Ouvintes do conteúdo do checklist: ligados uma vez só, neste bloco novo a cada visita à aba */
  var corpo = $('#ck-corpo');
  corpo.addEventListener('change', async function (e) {
    var rv = e.target.closest('[data-rev]');
    if (rv) { estado.revisao[rv.getAttribute('data-rev')] = rv.checked; rv.closest('.check').classList.toggle('feito', rv.checked); return; }
    var cx = e.target.closest('[data-chave]');
    if (!cx) return;
    var chave = cx.getAttribute('data-chave'), marcar = cx.checked;
    if (marcar) estado.marcados.add(chave); else estado.marcados.delete(chave);
    try {
      if (marcar) await gravar('marcados', sb.from('marcados').upsert({ chave: chave }));
      else await gravar('marcados', sb.from('marcados').delete().eq('chave', chave));
    } catch (err) {
      if (marcar) estado.marcados.delete(chave); else estado.marcados.add(chave);
      toast(err.message, true);
    }
    desenharSub();
  });
  corpo.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ref]');
    if (b) fichaReferencia(((window.Biblioteca && window.Biblioteca.REFERENCIAS) || [])[+b.getAttribute('data-ref')]);
  });
  desenharSub();
}

function desenharSub() {
  var B = window.Biblioteca, alvo = $('#ck-corpo');
  if (!alvo) return;
  try {
    if (estado.ckAba === 'checklist') subChecklist(alvo, B);
    else if (estado.ckAba === 'referencias') subReferencias(alvo, B);
    else if (estado.ckAba === 'roteiros') subRoteiros(alvo, B);
    else if (estado.ckAba === 'nichos') subNichos(alvo, B);
    else subRevisar(alvo, B);
  } catch (e) {
    alvo.innerHTML = '<div class="cartao"><h2>Não consegui montar esta parte</h2><p>' + esc(e.message) + '</p></div>';
  }
}

function barra(feitos, total) {
  var pc = total > 0 ? Math.round(feitos / total * 100) : 0;
  return '<div class="prog"><div class="trilho"><i style="width:' + pc + '%"></i></div><span>' + feitos + ' de ' + total + '</span></div>';
}

function subChecklist(alvo, B) {
  var secoes = B.CHECKLIST || [], totalGeral = 0, feitosGeral = 0;
  secoes.forEach(function (s) { (s.itens || []).forEach(function (_, i) { totalGeral++; if (estado.marcados.has(s.id + ':' + i)) feitosGeral++; }); });
  alvo.innerHTML = '<div class="cartao"><h2>Quanto do portfólio já está pronto</h2>' + barra(feitosGeral, totalGeral) + '</div>' +
    secoes.map(function (s) {
      var itens = s.itens || [], f = 0;
      itens.forEach(function (_, i) { if (estado.marcados.has(s.id + ':' + i)) f++; });
      return '<details class="sec" data-sec="' + esc(s.id) + '"' + (estado.ckAbertas[s.id] ? ' open' : '') + '><summary>' +
        '<span style="font-size:1.4rem;line-height:1" aria-hidden="true">' + esc(s.emoji) + '</span>' +
        '<span class="tit"><b>' + esc(s.nome) + '</b><small>' + esc(s.resumo) + '</small></span>' +
        barra(f, itens.length) +
        '<span class="seta">' + ic('baixo') + '</span></summary><div class="sec-corpo">' +
        '<p class="porque"><b>Por quê: </b>' + esc(s.porque) + '</p>' +
        itens.map(function (it, i) {
          var chave = s.id + ':' + i, on = estado.marcados.has(chave);
          return '<div class="check' + (on ? ' feito' : '') + '"><input type="checkbox" id="ck-' + esc(chave) + '" data-chave="' + esc(chave) + '"' + (on ? ' checked' : '') + '>' +
            '<label for="ck-' + esc(chave) + '"><b>' + esc(it.t) + '</b><small>' + esc(it.d) + '</small></label></div>';
        }).join('') + '</div></details>';
    }).join('');

  $$('details.sec', alvo).forEach(function (d) {
    d.addEventListener('toggle', function () { estado.ckAbertas[d.getAttribute('data-sec')] = d.open; });
  });
}

function subReferencias(alvo, B) {
  var refs = B.REFERENCIAS || [];
  alvo.innerHTML = '<div class="refs">' + refs.map(function (r, i) {
    return '<button type="button" class="ref" data-ref="' + i + '"><div class="capa c-' + esc(r.cor) + '"><span class="emo" aria-hidden="true">' + esc(r.emoji) + '</span>' +
      '<div class="tags"><span>' + esc(r.estilo) + '</span><span>' + esc(r.duracao) + '</span></div></div>' +
      '<div class="txt"><b>' + esc(r.titulo) + '</b><small>' + esc(r.marca) + '</small></div></button>';
  }).join('') + '</div>';
}

/* Ficha aberta ao clicar em uma referência de vídeo */
function fichaReferencia(r) {
    if (!r) return;
    abrirModal('<div class="modal-topo"><h2>' + esc(r.emoji) + ' ' + esc(r.titulo) + '</h2><button class="ib" type="button" data-fechar aria-label="Fechar">' + ic('x') + '</button></div>' +
      '<div class="ficha-ref"><div class="tags-ref"><span class="pil p-lead">' + esc(r.estilo) + '</span><span class="pil p-s3">' + esc(r.duracao) + '</span><span class="pil p-cliente">' + esc(r.marca) + '</span><span class="pil p-parada">' + esc(r.audiencia) + '</span></div>' +
      '<h3>Gancho</h3><blockquote>' + esc(r.gancho) + '</blockquote>' +
      '<h3>Por que funciona</h3><p>' + esc(r.porque) + '</p>' +
      '<h3>O diferencial</h3><p>' + esc(r.diferencial) + '</p>' +
      '<h3>Erro comum</h3><p>' + esc(r.erro) + '</p>' +
      '<h3>Roteiro em blocos</h3><div class="blocos">' + (r.roteiro || []).map(function (b2) {
        return '<div class="bloco"><span class="t">' + esc(b2.t) + '</span><span class="o">' + htmlSeguro(b2.o) + '</span></div>';
      }).join('') + '</div></div>' +
      '<div class="modal-rodape"><span class="espaco"></span><a class="btn primario" href="' + esc(r.youtube) + '" target="_blank" rel="noopener">' + ic('fora') + 'Assistir</a></div>', true);
}

function subRoteiros(alvo, B) {
  alvo.innerHTML = (B.TIPOS || []).map(function (t) {
    return '<details class="sec"><summary><span style="font-size:1.4rem;line-height:1" aria-hidden="true">' + esc(t.emoji) + '</span>' +
      '<span class="tit"><b>' + esc(t.nome) + '</b><small>' + esc(t.duracao) + '</small></span><span class="seta">' + ic('baixo') + '</span></summary><div class="sec-corpo ficha-ref">' +
      '<h3>Quando usar</h3><p>' + esc(t.porque) + '</p>' +
      '<h3>Blocos de tempo</h3><div class="blocos">' + (t.beats || []).map(function (b) {
        return '<div class="bloco"><span class="t">' + esc(b.t) + '</span><span class="o">' + htmlSeguro(b.o) + '</span></div>';
      }).join('') + '</div>' +
      ((t.erros && t.erros.length) ? '<h3>Erros comuns</h3><ul class="simples">' + t.erros.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
      '</div></details>';
  }).join('');
}

function subNichos(alvo, B) {
  alvo.innerHTML = '<div class="grade-ideias">' + (B.NICHOS || []).map(function (n) {
    return '<div class="cartao" style="margin:0"><h2><span aria-hidden="true">' + esc(n.emoji) + '</span> ' + esc(n.nome) + '</h2>' +
      (n.ideias || []).map(function (i) { return '<div class="ideia"><b>' + esc(i.t) + '</b><small>' + esc(i.gancho) + '</small></div>'; }).join('') + '</div>';
  }).join('') + '</div>';
}

function subRevisar(alvo, B) {
  var blocos = B.REVISAO || [];
  alvo.innerHTML = '<div class="rev-grade"><div class="cartao" style="margin:0"><h2>Cole aqui o seu roteiro</h2>' +
    '<textarea id="rev-texto" aria-label="Seu roteiro" placeholder="Cole ou escreva o roteiro do vídeo aqui...">' + esc(estado.roteiro) + '</textarea>' +
    '<p class="legenda" id="rev-contagem" style="margin-top:6px;color:var(--azul)"></p></div>' +
    '<div>' + blocos.map(function (b, bi) {
      return '<div class="cartao"><h2><span aria-hidden="true">' + esc(b.emoji) + '</span> ' + esc(b.bloco) + '</h2>' +
        (b.itens || []).map(function (it, ii) {
          var ch = bi + ':' + ii, on = !!estado.revisao[ch];
          return '<div class="check' + (on ? ' feito' : '') + '"><input type="checkbox" id="rv-' + ch.replace(':', '-') + '" data-rev="' + ch + '"' + (on ? ' checked' : '') + '>' +
            '<label for="rv-' + ch.replace(':', '-') + '"><b>' + esc(it.t) + '</b><small>' + esc(it.d) + '</small></label></div>';
        }).join('') + '</div>';
    }).join('') + '<button class="btn" type="button" id="rev-limpar">Limpar as marcações</button></div></div>';
  var txt = $('#rev-texto');
  function contar() {
    var n = (txt.value.trim().match(/\S+/g) || []).length;
    $('#rev-contagem').textContent = n ? plural(n, 'palavra', 'palavras') + ' no roteiro.' : '';
  }
  txt.addEventListener('input', function () { estado.roteiro = txt.value; contar(); });
  contar();
  $('#rev-limpar').addEventListener('click', function () { estado.revisao = {}; subRevisar(alvo, B); });
}
</script>
</body>
</html>
